    /* ============================= TRANSACTIONS PAGE ============================= */
    function TransactionsPage({ data, ctx, onEdit, onDelete, exportCSV }) {
      const [query, setQuery] = useState('');
      const [typeFilter, setTypeFilter] = useState('all');
      const [accountFilter, setAccountFilter] = useState('all');
      const [fromDate, setFromDate] = useState('');
      const [toDate, setToDate] = useState('');

      const filtered = useMemo(() => {
        return data.transactions.filter(t => {
          if (typeFilter !== 'all' && t.type !== typeFilter) return false;
          if (accountFilter !== 'all' && t.accountId !== accountFilter && t.toAccountId !== accountFilter) return false;
          if (fromDate && t.date < fromDate) return false;
          if (toDate && t.date > toDate) return false;
          if (query) {
            const q = query.toLowerCase();
            const hay = [txTitle(t, ctx), t.description, t.category, t.source, t.paymentMethod].filter(Boolean).join(' ').toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        }).sort((a, b) => b.date < a.date ? -1 : b.date > a.date ? 1 : (b.createdAt || '').localeCompare(a.createdAt || ''));
      }, [data.transactions, query, typeFilter, accountFilter, fromDate, toDate]);

      const grouped = useMemo(() => {
        const g = {};
        for (const t of filtered) { (g[t.date] = g[t.date] || []).push(t); }
        return Object.entries(g);
      }, [filtered]);

      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          <div className="row between">
            <div className="h1">Transactions</div>
            {exportCSV && <button className="btn btn-sm" onClick={exportCSV}><Icon name="download" style={{ width: 13, height: 13 }} />Export CSV</button>}
          </div>
          <div className="card card-tight">
            <div className="row" style={{ gap: 8, marginBottom: 10, background: 'var(--surface-2)', border: '1px solid var(--rule)', borderRadius: 9, padding: '4px 13px' }}>
              <Icon name="search" style={{ color: 'var(--text-faint)', flexShrink: 0, width: 16, height: 16 }} />
              <input style={{ flex: 1, minWidth: 0, background: 'transparent', border: 'none', outline: 'none', color: 'var(--text)', fontSize: 16, minHeight: 44 }}
                placeholder="Search description, category, account…" value={query} onChange={e => setQuery(e.target.value)} />
            </div>
            <div className="grid grid-4">
              <Select className="input-ui" aria-label="Filter by type" value={typeFilter} onChange={e => setTypeFilter(e.target.value)}>
                <option value="all">All types</option>
                <option value="income">Income</option><option value="expense">Expense</option><option value="transfer">Transfer</option>
                <option value="loan_payment">Loan EMI</option><option value="investment">Investment</option>
              </Select>
              <Select className="input-ui" aria-label="Filter by account" value={accountFilter} onChange={e => setAccountFilter(e.target.value)}>
                <option value="all">All accounts</option>
                {data.accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
              </Select>
              <input className="input-ui" type="date" aria-label="From date" value={fromDate} onChange={e => setFromDate(e.target.value)} />
              <input className="input-ui" type="date" aria-label="To date" value={toDate} onChange={e => setToDate(e.target.value)} />
            </div>
          </div>
          <div className="card">
            {grouped.length === 0 ? (
              <EmptyState icon="list" title="No transactions found" body="Try clearing your filters, or add a new transaction using the + button." />
            ) : grouped.map(([date, items]) => (
              <div key={date} style={{ marginBottom: 6 }}>
                <div className="faint" style={{ fontSize: 11.5, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '.05em', padding: '10px 4px 2px' }}>{fmtDate(date)}</div>
                {items.map(t => <TransactionRow key={t.id} t={t} ctx={ctx} onEdit={onEdit} onDelete={onDelete} />)}
              </div>
            ))}
          </div>
        </div>
      );
    }

    /* ============================= ACCOUNTS PAGE ============================= */
    function AccountsPage({ data, balances, onAdd, onEdit }) {
      const banks = data.accounts.filter(a => a.type !== 'credit_card');
      const cards = data.accounts.filter(a => a.type === 'credit_card');
      const iconFor = { bank: '🏦', cash: '💵', wallet: '📲', credit_card: '💳' };
      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
          <div className="row between"><div className="h1">Accounts</div><button className="btn btn-primary btn-sm" onClick={onAdd}><Icon name="plus" style={{ width: 14, height: 14 }} />Add account</button></div>
          {data.accounts.length === 0 ? (
            <div className="card"><EmptyState icon="wallet" title="No accounts yet" body="Add your bank accounts, cash, wallets or credit cards to start tracking balances." /></div>
          ) : (
            <>
              <div className="card">
                <div className="h3" style={{ marginBottom: 8 }}>Bank, cash & wallets</div>
                {banks.length === 0 ? <div className="faint" style={{ fontSize: 13 }}>None added.</div> : banks.map(a => (
                  <div className="list-row" key={a.id} style={{ cursor: 'pointer' }} onClick={() => onEdit(a)}>
                    <div className="swatch" style={{ background: 'var(--surface-3)' }}>{iconFor[a.type]}</div>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontWeight: 600, fontSize: 14 }}>{a.name}</div>
                      <div className="faint" style={{ fontSize: 12 }}>{a.institution || ACCOUNT_TYPES.find(t => t.id === a.type).label}</div>
                    </div>
                    <div className="num" style={{ fontWeight: 700, color: balances[a.id] < 0 ? 'var(--red)' : 'var(--text)' }}>{fmtINR(balances[a.id])}</div>
                  </div>
                ))}
              </div>
              <div className="card">
                <div className="h3" style={{ marginBottom: 8 }}>Credit cards</div>
                {cards.length === 0 ? <div className="faint" style={{ fontSize: 13 }}>None added.</div> : cards.map(a => {
                  const outstanding = -balances[a.id];
                  const available = (a.creditLimit || 0) - outstanding;
                  return (
                    <div key={a.id} style={{ padding: '10px 4px', borderBottom: '1px solid var(--rule-soft)', cursor: 'pointer' }} onClick={() => onEdit(a)}>
                      <div className="row between"><div style={{ fontWeight: 600 }}>{a.name}</div><div className="num" style={{ color: 'var(--red)', fontWeight: 700 }}>{fmtINR(outstanding)} due</div></div>
                      <ProgressBar pct={a.creditLimit ? (outstanding / a.creditLimit * 100) : 0} color="var(--red)" />
                      <div className="faint" style={{ fontSize: 11.5, marginTop: 4 }}>{fmtINR(available)} available of {fmtINR(a.creditLimit || 0)} limit</div>
                    </div>
                  );
                })}
              </div>
            </>
          )}
        </div>
      );
    }

    /* ============================= LOANS PAGE ============================= */
    function LoansPage({ data, onAdd, onEdit, onPayEmi }) {
      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
          <div className="row between"><div className="h1">Loans</div><button className="btn btn-primary btn-sm" onClick={onAdd}><Icon name="plus" style={{ width: 14, height: 14 }} />Add loan</button></div>
          {data.loans.length === 0 ? (
            <div className="card"><EmptyState icon="loan" title="No loans tracked" body="Add an existing loan to track EMIs and see them in your Future Money timeline." /></div>
          ) : data.loans.map(l => {
            const remaining = loanRemainingAt(l, data.transactions, todayStr());
            const pct = l.totalEmis ? (l.paidEmis / l.totalEmis * 100) : 0;
            return (
              <div className="card" key={l.id}>
                <div className="row between">
                  <div>
                    <div className="h2">{l.name}</div>
                    <div className="faint" style={{ fontSize: 12 }}>{l.lender || 'Lender not set'} · {l.interestRate}% p.a.</div>
                  </div>
                  <button className="icon-btn" onClick={() => onEdit(l)}><Icon name="edit" /></button>
                </div>
                <div className="grid grid-3" style={{ marginTop: 12 }}>
                  <div><div className="faint" style={{ fontSize: 11.5 }}>Original amount</div><div className="num" style={{ fontWeight: 700 }}>{fmtINR(l.originalAmount)}</div></div>
                  <div><div className="faint" style={{ fontSize: 11.5 }}>EMI</div><div className="num" style={{ fontWeight: 700 }}>{fmtINR(l.emi)}</div></div>
                  <div><div className="faint" style={{ fontSize: 11.5 }}>Remaining</div><div className="num" style={{ fontWeight: 700, color: 'var(--red)' }}>{fmtINR(remaining)}</div></div>
                </div>
                <div style={{ marginTop: 10 }}>
                  <ProgressBar pct={pct} />
                  <div className="faint" style={{ fontSize: 11.5, marginTop: 5 }}>{l.paidEmis} of {l.totalEmis} EMIs paid</div>
                </div>
                {l.paidEmis < l.totalEmis && (
                  <button className="btn btn-sm" style={{ marginTop: 12 }} onClick={() => onPayEmi(l)}>Record this month's EMI payment</button>
                )}
              </div>
            );
          })}
        </div>
      );
    }

    /* ============================= INVESTMENTS PAGE ============================= */
    function InvestmentsPage({ data, onAdd, onEdit }) {
      const total = data.investments.reduce((s, i) => s + investmentValueAt(i, data.transactions, todayStr()), 0);
      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
          <div className="row between"><div className="h1">Investments & FDs</div><button className="btn btn-primary btn-sm" onClick={onAdd}><Icon name="plus" style={{ width: 14, height: 14 }} />Add</button></div>
          {data.investments.length === 0 ? (
            <div className="card"><EmptyState icon="invest" title="No investments yet" body="Track your FDs, mutual funds, stocks or other savings here — kept clearly separate from spending." /></div>
          ) : (
            <>
              <div className="card"><div className="h3">Total invested</div><div className="kpi-num num" style={{ fontSize: 26, marginTop: 4 }}>{fmtINR(total)}</div></div>
              {data.investments.map(iv => (
                <div className="card" key={iv.id} style={{ cursor: 'pointer' }} onClick={() => onEdit(iv)}>
                  <div className="row between">
                    <div><div className="h2">{iv.bank}</div><div className="faint" style={{ fontSize: 12 }}>{iv.type} · {iv.rate}% p.a.</div></div>
                    <div style={{ textAlign: 'right' }}><div className="num" style={{ fontWeight: 700 }}>{fmtINR(iv.principal)}</div><div className="faint" style={{ fontSize: 11 }}>principal</div></div>
                  </div>
                  <div className="faint" style={{ fontSize: 12, marginTop: 8 }}>Matures {fmtDate(iv.maturityDate)} · est. {fmtINR(iv.maturityAmount)}{iv.autoRenew ? ' · auto-renews' : ''}</div>
                </div>
              ))}
            </>
          )}
        </div>
      );
    }

    /* ============================= BUDGETS PAGE ============================= */
    function BudgetsPage({ data, onAdd, onEdit }) {
      const ym = monthKey(todayStr());
      const spend = monthSpendByCategory(data, ym);
      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
          <div className="row between"><div className="h1">Budgets</div><button className="btn btn-primary btn-sm" onClick={onAdd}><Icon name="plus" style={{ width: 14, height: 14 }} />Add budget</button></div>
          {data.budgets.length === 0 ? (
            <div className="card"><EmptyState icon="budget" title="No budgets set" body="Set category budgets to get warnings before you overspend." /></div>
          ) : data.budgets.map(b => {
            const spent = spend[b.category] || 0;
            const pct = spent / b.amount * 100;
            const color = pct >= (b.thresholds[1] || 90) ? 'var(--red)' : pct >= (b.thresholds[0] || 75) ? 'var(--amber)' : 'var(--green)';
            return (
              <div className="card" key={b.id} style={{ cursor: 'pointer' }} onClick={() => onEdit(b)}>
                <div className="row between"><div style={{ fontWeight: 700 }}>{CATEGORY_EMOJI[b.category] || ''} {b.category}</div><div className="num" style={{ fontSize: 12.5 }}>{fmtINR(spent)} / {fmtINR(b.amount)}</div></div>
                <div style={{ marginTop: 8 }}><ProgressBar pct={pct} color={color} /></div>
                <div className="faint" style={{ fontSize: 11.5, marginTop: 5 }}>{spent <= b.amount ? fmtINR(b.amount - spent) + ' remaining' : fmtINR(spent - b.amount) + ' over budget'}</div>
              </div>
            );
          })}
        </div>
      );
    }

    /* ============================= GOALS PAGE ============================= */
    function GoalsPage({ data, onAdd, onEdit }) {
      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
          <div className="row between"><div className="h1">Savings Goals</div><button className="btn btn-primary btn-sm" onClick={onAdd}><Icon name="plus" style={{ width: 14, height: 14 }} />Add goal</button></div>
          {data.goals.length === 0 ? (
            <div className="card"><EmptyState icon="goal" title="No goals yet" body="Create a goal for a car, house, wedding, or emergency fund and see if your plan gets you there." /></div>
          ) : data.goals.map(g => {
            const pct = g.currentAmount / g.targetAmount * 100;
            const monthsLeft = Math.max(0, Math.round(daysBetween(todayStr(), g.targetDate) / 30));
            const remaining = g.targetAmount - g.currentAmount;
            const onTrack = g.monthlyContribution * monthsLeft >= remaining;
            return (
              <div className="card" key={g.id} style={{ cursor: 'pointer' }} onClick={() => onEdit(g)}>
                <div className="row between"><div className="h2">{g.name}</div><div className={onTrack ? 'pill pill-green' : 'pill pill-red'}>{onTrack ? 'On track' : 'Behind'}</div></div>
                <div className="row between" style={{ marginTop: 8, fontSize: 13 }}><span className="muted">{fmtINR(g.currentAmount)} saved</span><span className="muted">Target {fmtINR(g.targetAmount)}</span></div>
                <div style={{ marginTop: 6 }}><ProgressBar pct={pct} /></div>
                <div className="faint" style={{ fontSize: 11.5, marginTop: 6 }}>{fmtDate(g.targetDate)} · saving {fmtINR(g.monthlyContribution)}/month</div>
              </div>
            );
          })}
        </div>
      );
    }

    /* ============================= TRIPS & EVENTS PAGE ============================= */
    function EventsPage({ data, ctx, onAdd, onQuickStart, onEdit }) {
      const today = todayStr();
      const enriched = data.events.map(ev => ({
        ev, spent: eventSpent(data, ev.id),
        status: ev.endDate < today ? 'past' : (ev.startDate > today ? 'upcoming' : 'ongoing'),
      })).sort((a, b) => b.ev.startDate < a.ev.startDate ? -1 : 1);
      const [openId, setOpenId] = useState(null);
      const statusLabel = { past: 'Completed', ongoing: 'Ongoing', upcoming: 'Upcoming' };
      const statusPill = { past: 'pill-muted', ongoing: 'pill-green', upcoming: 'pill-amber' };
      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
          <div className="row between"><div className="h1">Trips & Events</div><button className="btn btn-primary btn-sm" onClick={onAdd}><Icon name="plus" style={{ width: 14, height: 14 }} />Add</button></div>
          <div>
            <div className="faint" style={{ fontSize: 11.5, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '.06em', marginBottom: 6, paddingLeft: 2 }}>Quick start</div>
            <div className="quick-actions">
              {FESTIVAL_PRESETS.map(p => (
                <div key={p.name} className="qa-item" onClick={() => onQuickStart(p)}>
                  <div className="qa-circle" style={{ fontSize: 21 }}>{p.emoji}</div>
                  <div className="qa-label">{p.name}</div>
                </div>
              ))}
            </div>
          </div>
          {enriched.length === 0 ? (
            <div className="card"><EmptyState icon="trip" title="No trips or events yet" body="Planning a trip, a wedding, a festival or a party? Track its spending separately from your everyday budget, with its own total." action={<button className="btn btn-primary" style={{ marginTop: 6 }} onClick={onAdd}>Add your first trip or event</button>} /></div>
          ) : enriched.map(({ ev, spent, status }) => {
            const meta = EVENT_TYPES.find(t => t.id === ev.type) || EVENT_TYPES[EVENT_TYPES.length - 1];
            const isOpen = openId === ev.id;
            const pct = ev.budget ? (spent / ev.budget * 100) : 0;
            const evTx = data.transactions.filter(t => t.eventId === ev.id).sort((a, b) => b.date < a.date ? -1 : 1);
            return (
              <div className="card" key={ev.id}>
                <div className="row between" style={{ cursor: 'pointer' }} onClick={() => setOpenId(isOpen ? null : ev.id)}>
                  <div className="row" style={{ gap: 10 }}>
                    <div className="swatch" style={{ background: 'var(--surface-3)', fontSize: 17 }}>{meta.emoji}</div>
                    <div>
                      <div style={{ fontWeight: 700, fontSize: 15 }}>{ev.name}</div>
                      <div className="faint" style={{ fontSize: 12 }}>{fmtDateShort(ev.startDate)} – {fmtDateShort(ev.endDate)}</div>
                    </div>
                  </div>
                  <div style={{ textAlign: 'right' }}>
                    <div className="num" style={{ fontWeight: 700 }}>{fmtINR(spent)}</div>
                    <div className={'pill ' + statusPill[status]} style={{ marginTop: 3 }}>{statusLabel[status]}</div>
                  </div>
                </div>
                {ev.budget > 0 && (
                  <div style={{ marginTop: 10 }}>
                    <ProgressBar pct={pct} color={pct > 100 ? 'var(--red)' : 'var(--accent)'} />
                    <div className="faint" style={{ fontSize: 11.5, marginTop: 5 }}>{fmtINR(spent)} of {fmtINR(ev.budget)} budget{pct > 100 ? ' · over budget' : ''}</div>
                  </div>
                )}
                {isOpen && (
                  <div style={{ marginTop: 12, borderTop: '1px solid var(--rule)', paddingTop: 8 }}>
                    <div className="row between" style={{ marginBottom: 4 }}>
                      <button className="btn btn-sm" onClick={() => onEdit(ev)}>Edit details</button>
                    </div>
                    {evTx.length === 0 ? (
                      <div className="faint" style={{ fontSize: 12.5, padding: '8px 0' }}>No expenses linked yet. Tag an expense to this trip/event when adding it.</div>
                    ) : evTx.map(t => <TransactionRow key={t.id} t={t} ctx={ctx} />)}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      );
    }

    /* ============================= BILLS & RECURRING PAGE ============================= */
    function BillsPage({ data, onAddBill, onEditBill, onMarkPaid, onAddRecurring, onEditRecurring, onToggleRecurring }) {
      const [tab, setTab] = useState('bills');
      const upcomingBills = useMemo(() => {
        const out = [];
        for (const b of data.bills) for (const occ of billOccurrences(b, addDays(todayStr(), 90), todayStr())) out.push({ bill: b, ...occ });
        return out.sort((a, b) => a.date < b.date ? -1 : 1).slice(0, 20);
      }, [data.bills]);
      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
          <div className="h1">Bills & Recurring</div>
          <div className="tabs">
            <button className={tab === 'bills' ? 'active' : ''} onClick={() => setTab('bills')}>Bills</button>
            <button className={tab === 'recurring' ? 'active' : ''} onClick={() => setTab('recurring')}>Recurring transactions</button>
          </div>
          {tab === 'bills' ? (
            <>
              <button className="btn btn-primary" style={{ alignSelf: 'flex-start' }} onClick={onAddBill}><Icon name="plus" style={{ width: 14, height: 14 }} />Add bill</button>
              <div className="card">
                {upcomingBills.length === 0 ? <EmptyState icon="bill" title="No bills tracked" body="Add rent, electricity, subscriptions or other recurring bills." /> :
                  upcomingBills.map((o, i) => (
                    <div className="list-row" key={i}>
                      <div className="swatch" style={{ background: 'var(--red-soft)', color: 'var(--red)' }}>🧾</div>
                      <div style={{ flex: 1, cursor: 'pointer' }} onClick={() => onEditBill(o.bill)}>
                        <div style={{ fontWeight: 600, fontSize: 14 }}>{o.bill.name}</div>
                        <div className="faint" style={{ fontSize: 12 }}>{fmtDate(o.date)} · {o.bill.frequency}</div>
                      </div>
                      <div className="num" style={{ fontWeight: 700 }}>{fmtINR(o.amount)}</div>
                    </div>
                  ))}
              </div>
            </>
          ) : (
            <>
              <button className="btn btn-primary" style={{ alignSelf: 'flex-start' }} onClick={onAddRecurring}><Icon name="plus" style={{ width: 14, height: 14 }} />Add recurring</button>
              <div className="card">
                {data.recurring.length === 0 ? <EmptyState icon="bill" title="No recurring transactions" body="Add salary, rent, subscriptions or SIPs that repeat automatically." /> :
                  data.recurring.map(r => (
                    <div className="list-row" key={r.id}>
                      <div className="swatch" style={{ background: r.type === 'income' ? 'var(--green-soft)' : 'var(--surface-3)', color: r.type === 'income' ? 'var(--green)' : 'var(--text-dim)' }}>{r.type === 'income' ? '↑' : r.type === 'investment' ? '📈' : '↓'}</div>
                      <div style={{ flex: 1, cursor: 'pointer' }} onClick={() => onEditRecurring(r)}>
                        <div style={{ fontWeight: 600, fontSize: 14 }}>{r.label}</div>
                        <div className="faint" style={{ fontSize: 12 }}>{r.frequency} · next {fmtDate(r.nextDate)}{!r.active ? ' · paused' : ''}</div>
                      </div>
                      <div className="num" style={{ fontWeight: 700 }}>{fmtINR(r.amount)}</div>
                      <button className="btn btn-sm" onClick={() => onToggleRecurring(r)}>{r.active ? 'Pause' : 'Resume'}</button>
                    </div>
                  ))}
              </div>
            </>
          )}
        </div>
      );
    }

    /* ============================= NET WORTH PAGE ============================= */
    function NetWorthPage({ data }) {
      const today = todayStr();
      const nw = netWorthAt(data, today);
      const months = last6Months(today);
      const history = months.map(m => {
        const d = m + '-28';
        const snap = netWorthAt(data, d <= today ? d : today);
        return { m, value: snap.netWorth };
      });
      const segments = [
        { label: 'Cash & bank', value: Math.max(0, nw.assets), color: 'var(--green)' },
        { label: 'Investments', value: Math.max(0, nw.investAssets), color: 'var(--amber)' },
      ];
      const liabSegments = [
        { label: 'Credit cards', value: nw.liabilities, color: 'var(--red)' },
        { label: 'Loans', value: nw.loanLiab, color: 'var(--loan-color)' },
      ];
      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
          <div className="h1">Net Worth</div>
          <div className="card" style={{ textAlign: 'center', padding: '26px 18px' }}>
            <div className="h3">Net worth today</div>
            <div className="kpi-num serif num" style={{ fontSize: 38, margin: '6px 0' }}>{fmtINR(nw.netWorth)}</div>
            <div className="faint" style={{ fontSize: 12.5 }}>Assets − Liabilities</div>
          </div>
          <div className="card">
            <div className="h2" style={{ marginBottom: 8 }}>Trend (last 6 months, approx.)</div>
            <LineChart points={history.map(h => ({ y: h.value }))} height={140} showZero />
            <div className="row between faint" style={{ fontSize: 11 }}><span>{monthLabel(months[0] + '-01')}</span><span>{monthLabel(months[months.length - 1] + '-01')}</span></div>
          </div>
          <div className="grid grid-2">
            <div className="card" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 10 }}>
              <div className="h3">Assets</div>
              <DonutChart segments={segments} centerLabel={fmtINR(nw.assets + nw.investAssets)} centerSub="total" />
              {segments.map(s => <div key={s.label} className="row between" style={{ width: '100%', fontSize: 12.5 }}><span className="row" style={{ gap: 6 }}><span style={{ width: 9, height: 9, borderRadius: 99, background: s.color, display: 'inline-block' }}></span>{s.label}</span><span className="num">{fmtINR(s.value)}</span></div>)}
            </div>
            <div className="card" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 10 }}>
              <div className="h3">Liabilities</div>
              <DonutChart segments={liabSegments} centerLabel={fmtINR(nw.liabilities + nw.loanLiab)} centerSub="total" />
              {liabSegments.map(s => <div key={s.label} className="row between" style={{ width: '100%', fontSize: 12.5 }}><span className="row" style={{ gap: 6 }}><span style={{ width: 9, height: 9, borderRadius: 99, background: s.color, display: 'inline-block' }}></span>{s.label}</span><span className="num">{fmtINR(s.value)}</span></div>)}

    /* ============================= CALENDAR PAGE ============================= */
    function CalendarPage({ data }) {
      const [cursor, setCursor] = useState(todayStr().slice(0, 7) + '-01');
      const [selected, setSelected] = useState(todayStr());
      const dt = new Date(cursor + 'T00:00:00');
      const year = dt.getFullYear(), month = dt.getMonth();
      const firstDow = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const monthEnd = new Date(year, month + 1, 0).toISOString().slice(0, 10);
      const events = useMemo(() => buildUpcomingEvents(data, daysBetween(todayStr(), monthEnd) + 40, todayStr()).filter(e => e.date.slice(0, 7) === cursor.slice(0, 7)), [data, cursor]);
      const byDay = {};
      events.forEach(e => { (byDay[e.date] = byDay[e.date] || []).push(e); });
      data.investments.forEach(iv => { if (iv.maturityDate && iv.maturityDate.slice(0, 7) === cursor.slice(0, 7)) (byDay[iv.maturityDate] = byDay[iv.maturityDate] || []).push({ label: iv.bank + ' FD matures', amount: iv.maturityAmount, source: 'FD maturity' }); });
      const cells = [];
      for (let i = 0; i < firstDow; i++) cells.push(null);
      for (let d = 1; d <= daysInMonth; d++) cells.push(year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0'));

      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
          <div className="row between">
            <div className="h1">Financial Calendar</div>
            <div className="row" style={{ gap: 6 }}>
              <button className="icon-btn" onClick={() => setCursor(addMonths(cursor, -1))}>‹</button>
              <div style={{ fontWeight: 700, minWidth: 130, textAlign: 'center' }}>{monthLabel(cursor)}</div>
              <button className="icon-btn" onClick={() => setCursor(addMonths(cursor, 1))}>›</button>
            </div>
          </div>
          <div className="card">
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', gap: 4, marginBottom: 6 }}>
              {['S', 'M', 'T', 'W', 'T', 'F', 'S'].map((d, i) => <div key={i} className="faint" style={{ textAlign: 'center', fontSize: 11 }}>{d}</div>)}
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', gap: 4 }}>
              {cells.map((d, i) => {
                if (!d) return <div key={i}></div>;
                const has = byDay[d] && byDay[d].length > 0;
                const isToday = d === todayStr();
                const isSel = d === selected;
                return (
                  <div key={i} onClick={() => setSelected(d)} style={{
                    aspectRatio: '1', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
                    borderRadius: 9, cursor: 'pointer', fontSize: 12.5, position: 'relative',
                    background: isSel ? 'var(--accent)' : isToday ? 'var(--surface-3)' : 'transparent',
                    color: isSel ? 'var(--accent-ink)' : 'var(--text)',
                    border: isToday && !isSel ? '1px solid var(--accent)' : '1px solid transparent'
                  }}>
                    {parseInt(d.slice(8))}
                    {has && <div style={{ width: 4, height: 4, borderRadius: 99, background: isSel ? 'var(--accent-ink)' : 'var(--accent)', marginTop: 2 }} />}
                  </div>
                );
              })}
            </div>
          </div>
          <div className="card">
            <div className="h3" style={{ marginBottom: 8 }}>{fmtDate(selected)}</div>
            {(byDay[selected] || []).length === 0 ? <div className="faint" style={{ fontSize: 13 }}>No financial events on this day.</div> :
              (byDay[selected] || []).map((e, i) => (
                <div className="list-row" key={i}>
                  <div className="swatch" style={{ background: e.amount < 0 ? 'var(--red-soft)' : 'var(--green-soft)', color: e.amount < 0 ? 'var(--red)' : 'var(--green)' }}>{e.amount < 0 ? '↓' : '↑'}</div>

        </div>
      );

    function InsightsPage({ data }) {
      const today = todayStr();
      const ym = monthKey(today);
      const prevYm = monthKey(addMonths(today, -1));
      const insights = useMemo(() => {
        const list = [];
        const curSpend = monthSpendByCategory(data, ym);
        const prevSpend = monthSpendByCategory(data, prevYm);
        for (const cat of Object.keys(curSpend)) {
          const cur = curSpend[cat], prev = prevSpend[cat] || 0;
          if (prev > 0) {
            const pct = ((cur - prev) / prev) * 100;
            if (Math.abs(pct) >= 15) list.push({ text: `Your ${cat.toLowerCase()} spending ${pct > 0 ? 'increased' : 'decreased'} ${Math.abs(pct).toFixed(0)}% compared with last month.`, tone: pct > 0 ? 'red' : 'green' });
          }
        }
        const topCat = Object.entries(curSpend).sort((a, b) => b[1] - a[1])[0];
        if (topCat) list.push({ text: `Your highest expense category this month is ${topCat[0]} at ${fmtINR(topCat[1])}.`, tone: 'muted' });
        for (const b of data.budgets) {
          const spent = curSpend[b.category] || 0;
          const remaining = b.amount - spent;
          if (remaining >= 0) list.push({ text: `You have ${fmtINR(remaining)} remaining in your ${b.category} budget.`, tone: remaining < b.amount * 0.25 ? 'amber' : 'muted' });
          else list.push({ text: `You are ${fmtINR(-remaining)} over your ${b.category} budget this month.`, tone: 'red' });
        }
        const totals = monthTotals(data, ym);
        if (totals.income > 0) list.push({ text: `Your savings rate this month is ${totals.savingsRate.toFixed(1)}%.`, tone: totals.savingsRate >= 20 ? 'green' : 'amber' });
        const upcoming7 = buildUpcomingEvents(data, 7, today).filter(e => e.amount < 0);
        const sum7 = upcoming7.reduce((s, e) => s + Math.abs(e.amount), 0);
        if (sum7 > 0) list.push({ text: `Your upcoming payments in the next 7 days total ${fmtINR(sum7)}.`, tone: 'muted' });
        if (list.length === 0) list.push({ text: 'Add a few more transactions and budgets — insights get sharper with more data.', tone: 'muted' });
        return list;
      }, [data]);
      const toneColor = { red: 'var(--red)', green: 'var(--green)', amber: 'var(--amber)', muted: 'var(--text)' };
      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
          <div className="h1">Smart Insights</div>
          <div className="faint" style={{ fontSize: 13, marginTop: -8 }}>Calculated directly from your data — nothing here is guessed.</div>
          <div className="card">
            {insights.map((ins, i) => (
              <div key={i} className="list-row">
                <div className="swatch" style={{ background: 'var(--surface-3)' }}><Icon name="insight" style={{ width: 16, height: 16, color: toneColor[ins.tone] }} /></div>
                <div style={{ fontSize: 14 }}>{ins.text}</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    /* ============================= LOCK SCREEN ============================= */
    function LockScreen({ pin, onUnlock }) {
      const [entered, setEntered] = useState('');
      const [error, setError] = useState(false);
      function press(d) {
        const next = (entered + d).slice(0, 4);
        setEntered(next);
        setError(false);
        if (next.length === 4) {
          setTimeout(() => {
            if (next === pin) onUnlock();
            else { setError(true); setEntered(''); }
          }, 120);
        }
      }
      return (
        <div className="lock-screen">
          <Icon name="lock" style={{ width: 30, height: 30, color: 'var(--text-faint)' }} />
          <div className="h2">Enter PIN</div>
          <div className="pindots">{[0, 1, 2, 3].map(i => <div key={i} className={'pindot' + (i < entered.length ? ' filled' : '')} />)}</div>
          {error && <div style={{ color: 'var(--red)', fontSize: 13 }}>Incorrect PIN, try again.</div>}
          <div className="keypad">
            {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => <button key={n} onClick={() => press(String(n))}>{n}</button>)}
            <div></div>
            <button onClick={() => press('0')}>0</button>
            <button onClick={() => setEntered(e => e.slice(0, -1))}>⌫</button>
          </div>
        </div>
      );
    }

        },
      ];

      return (
        <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20 }}>
          <div className="card" style={{ maxWidth: 420, width: '100%' }}>
            <div className="row" style={{ gap: 5, marginBottom: 18 }}>
              {Array.from({ length: total }).map((_, i) => <div key={i} style={{ flex: 1, height: 3, borderRadius: 2, background: i <= step ? 'var(--accent)' : 'var(--rule)' }} />)}
            </div>
            <div className="h1" style={{ fontSize: 22, marginBottom: 12 }}>{steps[step].title}</div>
            {steps[step].body}
          </div>
        </div>
      );
    }

    /* ============================= APP ROOT ============================= */
    function App() {
      const [data, setData] = useState(() => loadState() || emptyState());
      const [tab, setTab] = useState('dashboard');
      const [locked, setLocked] = useState(false);
      const [moreOpen, setMoreOpen] = useState(false);
      const [navOpen, setNavOpen] = useState({});
      const [addSheetOpen, setAddSheetOpen] = useState(false);
      const [txModal, setTxModal] = useState(null); // { initialType, editing }
      const [entityModal, setEntityModal] = useState(null); // { kind, editing }
      const [profileModalOpen, setProfileModalOpen] = useState(false);
      const [toastMsg, setToastMsg] = useState(null);

      useEffect(() => { saveState(data); }, [data]);
      useEffect(() => {
        if (data.settings.pinEnabled && data.settings.pin) setLocked(true);
      }, []); // only on first mount

      useEffect(() => {
        const root = document.documentElement;
        const theme = data.settings.theme;
        if (theme === 'light') root.setAttribute('data-theme', 'light');
        else if (theme === 'dark') root.setAttribute('data-theme', 'dark');
        else root.removeAttribute('data-theme');
      }, [data.settings.theme]);

      function toast(msg) { setToastMsg(msg); }
      function update(fn) { setData(d => fn(JSON.parse(JSON.stringify(d)))); }

      /* ---- mutators ---- */
      const addAccount = useCallback((acc) => update(d => { d.accounts.push(acc); return d; }), []);
      const editAccount = useCallback((acc) => update(d => { d.accounts = d.accounts.map(a => a.id === acc.id ? acc : a); return d; }), []);
      const deleteAccount = useCallback((acc) => update(d => { d.accounts = d.accounts.filter(a => a.id !== acc.id); return d; }), []);

      const addTransaction = useCallback((t, opts) => update(d => {
        d.transactions.push(t);
        if (opts && opts.markLoanEmiPaid) {
          d.loans = d.loans.map(l => l.id === t.loanId ? { ...l, paidEmis: Math.min(l.totalEmis, l.paidEmis + 1) } : l);
        }
        return d;
      }), []);
      const editTransaction = useCallback((t) => update(d => { d.transactions = d.transactions.map(x => x.id === t.id ? t : x); return d; }), []);
      const deleteTransaction = useCallback((t) => update(d => {
        d.transactions = d.transactions.filter(x => x.id !== t.id);
        return d;
      }), []);

      const addLoan = useCallback((l) => update(d => { d.loans.push(l); return d; }), []);
      const editLoan = useCallback((l) => update(d => { d.loans = d.loans.map(x => x.id === l.id ? l : x); return d; }), []);
      const deleteLoan = useCallback((l) => update(d => { d.loans = d.loans.filter(x => x.id !== l.id); d.transactions = d.transactions.filter(t => t.loanId !== l.id); return d; }), []);

      const addInvestment = useCallback((iv) => update(d => { d.investments.push(iv); return d; }), []);
      const editInvestment = useCallback((iv) => update(d => { d.investments = d.investments.map(x => x.id === iv.id ? iv : x); return d; }), []);
      const deleteInvestment = useCallback((iv) => update(d => { d.investments = d.investments.filter(x => x.id !== iv.id); d.transactions = d.transactions.filter(t => t.investmentId !== iv.id); return d; }), []);

      const addBudget = useCallback((b) => update(d => { d.budgets.push(b); return d; }), []);
      const editBudget = useCallback((b) => update(d => { d.budgets = d.budgets.map(x => x.id === b.id ? b : x); return d; }), []);
      const deleteBudget = useCallback((b) => update(d => { d.budgets = d.budgets.filter(x => x.id !== b.id); return d; }), []);

      const addGoal = useCallback((g) => update(d => { d.goals.push(g); return d; }), []);
      const editGoal = useCallback((g) => update(d => { d.goals = d.goals.map(x => x.id === g.id ? g : x); return d; }), []);
      const deleteGoal = useCallback((g) => update(d => { d.goals = d.goals.filter(x => x.id !== g.id); return d; }), []);

      const addBill = useCallback((b) => update(d => { d.bills.push(b); return d; }), []);
      const editBill = useCallback((b) => update(d => { d.bills = d.bills.map(x => x.id === b.id ? b : x); return d; }), []);
      const deleteBill = useCallback((b) => update(d => { d.bills = d.bills.filter(x => x.id !== b.id); return d; }), []);

      const addRecurring = useCallback((r) => update(d => { d.recurring.push(r); return d; }), []);
      const editRecurring = useCallback((r) => update(d => { d.recurring = d.recurring.map(x => x.id === r.id ? r : x); return d; }), []);
      const deleteRecurring = useCallback((r) => update(d => { d.recurring = d.recurring.filter(x => x.id !== r.id); return d; }), []);
      const toggleRecurring = useCallback((r) => update(d => { d.recurring = d.recurring.map(x => x.id === r.id ? { ...x, active: !x.active } : x); return d; }), []);

      const updateSettings = useCallback((patch) => update(d => { d.settings = { ...d.settings, ...patch }; return d; }), []);
      const setProfileName = useCallback((name) => update(d => { d.profile = { ...d.profile, name }; return d; }), []);
      const updateProfile = useCallback((patch) => update(d => { d.profile = { ...d.profile, ...patch }; return d; }), []);

      const addEvent = useCallback((ev) => update(d => { d.events.push(ev); return d; }), []);
      const editEvent = useCallback((ev) => update(d => { d.events = d.events.map(x => x.id === ev.id ? ev : x); return d; }), []);
      const deleteEvent = useCallback((ev) => update(d => { d.events = d.events.filter(x => x.id !== ev.id); d.transactions = d.transactions.map(t => t.eventId === ev.id ? { ...t, eventId: null } : t); return d; }), []);

      const applyScenario = useCallback((deltas) => update(d => {
        for (const delta of deltas) {
          if (delta.loanParams) {
            d.loans.push({ id: uid('loan'), name: delta.label.replace('New loan EMI', 'New Loan') || 'New Loan', lender: '', originalAmount: delta.loanParams.principal, interestRate: delta.loanParams.rate, startDate: delta.date || todayStr(), totalEmis: delta.loanParams.months, paidEmis: 0, emi: delta.loanParams.emi });
          } else if (delta.recurring) {
            d.recurring.push({ id: uid('rec'), type: delta.amount >= 0 ? 'income' : 'expense', label: delta.label, amount: Math.abs(delta.amount), frequency: 'monthly', nextDate: delta.date || todayStr(), accountId: (d.accounts[0] || {}).id, active: true });
          } else {
            d.bills.push({ id: uid('bill'), name: delta.label, amount: Math.abs(delta.amount), dueDate: delta.date || todayStr(), frequency: 'once', category: 'Other', paid: false });
          }
        }
        return d;
      }), []);

      function payEmi(loan) {
        const accountId = data.accounts[0] && data.accounts[0].id;
        setTxModal({ initialType: 'loan_payment', editing: { type: 'loan_payment', amount: loan.emi, date: todayStr(), loanId: loan.id, accountId } });
      }

      function handleQuickAction(action) {
        if (action === 'expense') setTxModal({ initialType: 'expense' });
        else if (action === 'income') setTxModal({ initialType: 'income' });
        else if (action === 'trip') setEntityModal({ kind: 'event' });
        else if (action === 'whatif') setTab('whatif');
        else if (action === 'safetospend') setTab('safetospend');
        else if (action === 'future') setTab('futuremoney');
      }

      const saveScenario = useCallback((name, deltas) => update(d => {
        d.scenarios.push({ id: uid('scn'), name, createdAt: new Date().toISOString(), deltas });
        return d;
      }), []);
      const deleteScenarioFn = useCallback((id) => update(d => { d.scenarios = d.scenarios.filter(s => s.id !== id); return d; }), []);

      function exportTransactionsCSV() {
        const header = ['Date', 'Type', 'Category/Source', 'Amount', 'Account', 'To Account', 'Payment Method', 'Description'];
        const rows = data.transactions.slice().sort((a, b) => a.date < b.date ? -1 : 1).map(t => {
          const acc = accountsById[t.accountId] ? accountsById[t.accountId].name : '';
          const toAcc = accountsById[t.toAccountId] ? accountsById[t.toAccountId].name : '';
          const label = t.type === 'expense' ? (t.category || '') : t.type === 'income' ? (t.source || '') : txTitle(t, ctx);
          const csvSafe = (s) => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
          return [t.date, t.type, label, t.amount, acc, toAcc, t.paymentMethod || '', t.description || ''].map(csvSafe).join(',');
        });
        const csv = [header.map(h => '"' + h + '"').join(',')].concat(rows).join('\n');
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'movo-transactions-' + todayStr() + '.csv';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        toast('Transactions CSV downloaded.');
      }

      function exportData() {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'movo-backup-' + todayStr() + '.json';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        toast('Backup downloaded.');
      }
      function importData(file) {
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(reader.result);
            if (!parsed || !Array.isArray(parsed.accounts)) throw new Error('bad file');
            setData(parsed);
            toast('Backup restored.');
          } catch (e) { alert('Could not read this backup file.'); }
        };
        reader.readAsText(file);
      }
      function resetAll() { setData(emptyState()); setTab('dashboard'); }

      const accountsById = useMemo(() => Object.fromEntries(data.accounts.map(a => [a.id, a])), [data.accounts]);
      const loansById = useMemo(() => Object.fromEntries(data.loans.map(l => [l.id, l])), [data.loans]);
      const investmentsById = useMemo(() => Object.fromEntries(data.investments.map(i => [i.id, i])), [data.investments]);
      const ctx = { accountsById, loansById, investmentsById };
      const balances = useMemo(() => allAccountBalances(data, todayStr()), [data]);

      if (locked) return <LockScreen pin={data.settings.pin} onUnlock={() => setLocked(false)} />;
      if (!data.onboarded) {
        return <Onboarding
          addAccount={addAccount} addRecurring={addRecurring} addLoan={addLoan} addInvestment={addInvestment}
          updateProfile={updateProfile}
          onFinish={() => update(d => { d.onboarded = true; d.settings.introDismissed = true; return d; })}
        />;
      }

      const pageProps = { data, ctx, balances };
      let page;
      if (tab === 'dashboard') page = <Dashboard data={data} ctx={ctx} go={setTab} updateSettings={updateSettings} onQuickAction={handleQuickAction} />;
      else if (tab === 'transactions') page = <TransactionsPage data={data} ctx={ctx}
        onEdit={(t) => setTxModal({ editing: t })}
        onDelete={(t) => { if (confirm('Delete this transaction?')) deleteTransaction(t); }}
        exportCSV={exportTransactionsCSV} />;
      else if (tab === 'accounts') page = <AccountsPage data={data} balances={balances}
        onAdd={() => setEntityModal({ kind: 'account' })}
        onEdit={(a) => setEntityModal({ kind: 'account', editing: a })} />;
      else if (tab === 'safetospend') page = <SafeToSpendPage data={data} updateSettings={updateSettings} />;
      else if (tab === 'futuremoney') page = <FutureMoneyPage data={data} />;
      else if (tab === 'whatif') page = <WhatIfPage data={data} applyScenario={applyScenario} toast={toast} saveScenario={saveScenario} deleteScenario={deleteScenarioFn} />;
      else if (tab === 'events') page = <EventsPage data={data} ctx={ctx}
        onAdd={() => setEntityModal({ kind: 'event' })}
        onQuickStart={(preset) => {
          const start = nextOccurrenceOf(preset.monthDay[0], preset.monthDay[1]);
          setEntityModal({ kind: 'event', editing: { name: preset.name, type: preset.type, startDate: start, endDate: addDays(start, 2), budget: 0, notes: '' } });
        }}
        onEdit={(ev) => setEntityModal({ kind: 'event', editing: ev })} />;
      else if (tab === 'loans') page = <LoansPage data={data}
        onAdd={() => setEntityModal({ kind: 'loan' })}
        onEdit={(l) => setEntityModal({ kind: 'loan', editing: l })}
        onPayEmi={payEmi} />;
      else if (tab === 'investments') page = <InvestmentsPage data={data}
        onAdd={() => setEntityModal({ kind: 'investment' })}
        onEdit={(iv) => setEntityModal({ kind: 'investment', editing: iv })} />;
      else if (tab === 'budgets') page = <BudgetsPage data={data}
        onAdd={() => setEntityModal({ kind: 'budget' })}
        onEdit={(b) => setEntityModal({ kind: 'budget', editing: b })} />;
      else if (tab === 'goals') page = <GoalsPage data={data}
        onAdd={() => setEntityModal({ kind: 'goal' })}
        onEdit={(g) => setEntityModal({ kind: 'goal', editing: g })} />;
      else if (tab === 'bills') page = <BillsPage data={data}
        onAddBill={() => setEntityModal({ kind: 'bill' })}
        onEditBill={(b) => setEntityModal({ kind: 'bill', editing: b })}
        onAddRecurring={() => setEntityModal({ kind: 'recurring' })}
        onEditRecurring={(r) => setEntityModal({ kind: 'recurring', editing: r })}
        onToggleRecurring={toggleRecurring} />;
      else if (tab === 'health') page = <HealthPage data={data} />;
      else if (tab === 'networth') page = <NetWorthPage data={data} />;
      else if (tab === 'reports') page = <ReportsPage data={data} />;
      else if (tab === 'calendar') page = <CalendarPage data={data} />;
      else if (tab === 'insights') page = <InsightsPage data={data} />;
      else if (tab === 'settings') page = <SettingsPage data={data} updateSettings={updateSettings}
        exportData={exportData} importData={importData} resetAll={resetAll} exportCSV={exportTransactionsCSV}
        theme={data.settings.theme} setTheme={(t) => updateSettings({ theme: t })} />;
      else page = <Dashboard data={data} ctx={ctx} go={setTab} />;

      return (
        <div className="app-shell">
          <aside className="sidebar">
            <div className="brand">
              <div className="brand-row">
                <LogoMark size={30} pulse />
                <span className="mark">Movo</span>
              </div>
              <span className="tag">your money, your moves</span>
            </div>
            {[['', NAV_MAIN, false], ['Plan ahead', NAV_PLAN, true], ['Manage money', NAV_MANAGE, false], ['Understand', NAV_INSIGHTS, false]].map(([label, items, defOpen], gi) => {
              const forcedOpen = items.some(i => i.id === tab);
              const isOpen = label === '' || forcedOpen || (navOpen[label] !== undefined ? navOpen[label] : defOpen);
              return (
                <div key={gi}>
                  {label && (
                    <div className="navsection" style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', cursor: 'pointer' }}
                      onClick={() => setNavOpen(p => ({ ...p, [label]: !isOpen }))}>
                      <span>{label}</span>
                      <Icon name="chevronR" style={{ width: 11, height: 11, transform: isOpen ? 'rotate(90deg)' : 'none', transition: 'transform .15s' }} />
                    </div>
                  )}
                  {isOpen && items.map(it => (
                    <div key={it.id} className={'navitem' + (tab === it.id ? ' active' : '')} onClick={() => setTab(it.id)}>
                      <Icon name={it.icon} />{it.label}
                    </div>
                  ))}
                </div>
              );
            })}
            <div className="sidebar-add">
              <div className={'navitem' + (tab === 'settings' ? ' active' : '')} onClick={() => setTab('settings')}><Icon name="settings" />Settings</div>
              <button className="btn btn-primary btn-block" style={{ marginTop: 8 }} onClick={() => setAddSheetOpen(true)}><Icon name="plus" style={{ width: 14, height: 14 }} />Add transaction</button>
            </div>
          </aside>

          <div className="main">
            <div className="topbar">
              <div className="row" style={{ gap: 9, minWidth: 0 }}>
                <LogoMark size={26} />
                {tab === 'dashboard' ? (
                  <span className="mark" style={{ fontSize: 18 }}>Movo</span>
                ) : (
                  <div className="h2" style={{ textTransform: 'capitalize', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{ALL_NAV.find(n => n.id === tab) ? ALL_NAV.find(n => n.id === tab).label : 'Movo'}</div>
                )}
              </div>
              <div className="row" style={{ gap: 8, flexShrink: 0 }}>
                <button className="icon-btn" onClick={() => updateSettings({ theme: data.settings.theme === 'dark' ? 'light' : 'dark' })}>
                  <Icon name={data.settings.theme === 'dark' ? 'sun' : 'moon'} />
                </button>
                <Avatar name={data.profile.name} avatar={data.profile.avatar} size={32} onClick={() => setProfileModalOpen(true)} />
              </div>
            </div>
            <div className="content">{page}</div>
          </div>

          <nav className="bottomnav">
            {BOTTOM_NAV.map(it => {
              if (it.id === '__add') return (
                <div key={it.id} className="bn-item" onClick={() => setAddSheetOpen(true)}>
                  <button className="fab"><Icon name="plus" /></button>
                </div>
              );
              if (it.id === '__more') return (
                <div key={it.id} className={'bn-item' + (moreOpen ? ' active' : '')} onClick={() => setMoreOpen(true)}>
                  <Icon name={it.icon} /><span>{it.label}</span>
                </div>
              );
              return (
                <div key={it.id} className={'bn-item' + (tab === it.id ? ' active' : '')} onClick={() => setTab(it.id)}>
                  <Icon name={it.icon} /><span>{it.label}</span>
                </div>
              );
            })}
          </nav>

          {moreOpen && (
            <Modal title="More" onClose={() => setMoreOpen(false)}>
              {[...NAV_PLAN, ...NAV_MANAGE, ...NAV_INSIGHTS, ...NAV_MORE_EXTRA].map(it => (
                <div key={it.id} className="list-row" style={{ cursor: 'pointer' }} onClick={() => { setTab(it.id); setMoreOpen(false); }}>
                  <div className="swatch" style={{ background: 'var(--surface-3)' }}><Icon name={it.icon} style={{ width: 16, height: 16 }} /></div>
                  <div style={{ fontWeight: 600, fontSize: 14, flex: 1 }}>{it.label}</div>
                  <Icon name="chevronR" style={{ color: 'var(--text-faint)', width: 16, height: 16 }} />
                </div>
              ))}
            </Modal>
          )}

          {addSheetOpen && (
            <Modal title="Add" onClose={() => setAddSheetOpen(false)}>
              <div className="grid grid-3">
                {[
                  { id: 'income', label: 'Income', icon: 'arrowUp' },
                  { id: 'expense', label: 'Expense', icon: 'arrowDown' },
                  { id: 'transfer', label: 'Transfer', icon: 'transfer' },
                  { id: 'loan_payment', label: 'Pay EMI', icon: 'loan' },
                  { id: 'investment', label: 'Invest', icon: 'invest' },
                  { id: 'bill', label: 'Bill', icon: 'bill' },
                ].map(o => (
                  <button key={o.id} className="btn" style={{ flexDirection: 'column', height: 74, gap: 6 }} onClick={() => {
                    setAddSheetOpen(false);
                    if (o.id === 'bill') setEntityModal({ kind: 'bill' });
                    else setTxModal({ initialType: o.id });
                  }}>
                    <Icon name={o.icon} style={{ width: 20, height: 20 }} /><span style={{ fontSize: 11.5 }}>{o.label}</span>
                  </button>
                ))}
              </div>
            </Modal>
          )}

          {txModal && (
            <AddTransactionModal data={data} editing={txModal.editing || null}
              initialType={txModal.initialType} profileName={data.profile.name}
              onClose={() => setTxModal(null)}
              onSave={(t, opts) => { if (t.id && data.transactions.some(x => x.id === t.id)) editTransaction(t); else addTransaction(t, opts); toast('Saved.'); }} />
          )}

          {entityModal && entityModal.kind === 'account' && (
            <AccountModal editing={entityModal.editing} onClose={() => setEntityModal(null)}
              onSave={(a) => { entityModal.editing ? editAccount(a) : addAccount(a); toast('Account saved.'); }}
              onDelete={deleteAccount} />
          )}
          {entityModal && entityModal.kind === 'loan' && (
            <LoanModal editing={entityModal.editing} onClose={() => setEntityModal(null)}
              onSave={(l) => { entityModal.editing ? editLoan(l) : addLoan(l); toast('Loan saved.'); }}
              onDelete={deleteLoan} />
          )}
          {entityModal && entityModal.kind === 'investment' && (
            <InvestmentModal editing={entityModal.editing} accounts={data.accounts} onClose={() => setEntityModal(null)}
              onSave={(iv) => { entityModal.editing ? editInvestment(iv) : addInvestment(iv); toast('Investment saved.'); }}
              onDelete={deleteInvestment} />
          )}
          {entityModal && entityModal.kind === 'budget' && (
            <BudgetModal editing={entityModal.editing} existingCats={data.budgets.map(b => b.category)} onClose={() => setEntityModal(null)}
              onSave={(b) => { entityModal.editing ? editBudget(b) : addBudget(b); toast('Budget saved.'); }}
              onDelete={deleteBudget} />
          )}
          {entityModal && entityModal.kind === 'goal' && (
            <GoalModal editing={entityModal.editing} accounts={data.accounts} onClose={() => setEntityModal(null)}
              onSave={(g) => { entityModal.editing ? editGoal(g) : addGoal(g); toast('Goal saved.'); }}
              onDelete={deleteGoal} />
          )}
          {entityModal && entityModal.kind === 'bill' && (
            <BillModal editing={entityModal.editing} onClose={() => setEntityModal(null)}
              onSave={(b) => { entityModal.editing ? editBill(b) : addBill(b); toast('Bill saved.'); }}
              onDelete={deleteBill} />
          )}
          {entityModal && entityModal.kind === 'recurring' && (
            <RecurringModal editing={entityModal.editing} accounts={data.accounts} onClose={() => setEntityModal(null)}
              onSave={(r) => { entityModal.editing ? editRecurring(r) : addRecurring(r); toast('Recurring transaction saved.'); }}
              onDelete={deleteRecurring} />
          )}
          {entityModal && entityModal.kind === 'event' && (
            <EventModal editing={entityModal.editing} onClose={() => setEntityModal(null)}
              onSave={(ev) => { (ev.id && data.events.some(x => x.id === ev.id)) ? editEvent(ev) : addEvent(ev); toast('Trip / event saved.'); }}
              onDelete={deleteEvent} />
          )}
          {profileModalOpen && (
            <ProfileModal profile={data.profile} pinEnabled={data.settings.pinEnabled} onClose={() => setProfileModalOpen(false)}
              onSave={(p) => { updateProfile(p); toast('Profile updated.'); }}
              onTogglePin={(e) => {
                if (e.target.checked) {
                  const pin = prompt('Set a 4-digit PIN:');
                  if (pin && /^\d{4}$/.test(pin)) updateSettings({ pinEnabled: true, pin });
                } else updateSettings({ pinEnabled: false, pin: '' });
              }} />
          )}

          {toastMsg && <Toast message={toastMsg} onDone={() => setToastMsg(null)} />}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
