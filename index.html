<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Movo" />
  <meta name="application-name" content="Movo" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,500&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <script>
    // Build the app icon (matches the in-app logo: coin + motion lines on a rounded accent square)
    // and register it as apple-touch-icon / favicon / web-app-manifest so "Add to Home Screen"
    // gets a real icon and opens full-screen instead of as a plain browser bookmark.
    (function () {
      try {
        function drawIcon(size) {
          const canvas = document.createElement('canvas');
          canvas.width = size; canvas.height = size;
          const ctx = canvas.getContext('2d');
          const r = size * 0.22;
          ctx.fillStyle = '#2E4FE0';
          ctx.beginPath();
          ctx.moveTo(r, 0);
          ctx.arcTo(size, 0, size, size, r);
          ctx.arcTo(size, size, 0, size, r);
          ctx.arcTo(0, size, 0, 0, r);
          ctx.arcTo(0, 0, size, 0, r);
          ctx.closePath();
          ctx.fill();
          const s = size / 24;
          ctx.strokeStyle = '#FFFFFF'; ctx.lineCap = 'round';
          ctx.lineWidth = 2.1 * s;
          ctx.globalAlpha = 0.4;
          ctx.beginPath(); ctx.moveTo(4 * s, 8 * s); ctx.lineTo(9.5 * s, 8 * s); ctx.stroke();
          ctx.globalAlpha = 0.75;
          ctx.beginPath(); ctx.moveTo(3.5 * s, 12 * s); ctx.lineTo(12 * s, 12 * s); ctx.stroke();
          ctx.globalAlpha = 0.4;
          ctx.beginPath(); ctx.moveTo(4 * s, 16 * s); ctx.lineTo(9.5 * s, 16 * s); ctx.stroke();
          ctx.globalAlpha = 1;
          ctx.fillStyle = '#FFFFFF';
          ctx.beginPath(); ctx.arc(17.5 * s, 12 * s, 6.2 * s, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#2E4FE0'; ctx.lineWidth = 1.5 * s;
          ctx.beginPath(); ctx.moveTo(15 * s, 12 * s); ctx.lineTo(20 * s, 12 * s); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(17.5 * s, 9.5 * s); ctx.lineTo(17.5 * s, 14.5 * s); ctx.stroke();
          return canvas.toDataURL('image/png');
        }
        function setLink(rel, href, sizes) {
          let el = document.querySelector('link[rel="' + rel + '"]' + (sizes ? '[sizes="' + sizes + '"]' : ''));
          if (!el) { el = document.createElement('link'); el.rel = rel; if (sizes) el.sizes = sizes; document.head.appendChild(el); }
          el.href = href;
        }
        const icon180 = drawIcon(180);
        const icon192 = drawIcon(192);
        const icon512 = drawIcon(512);
        setLink('apple-touch-icon', icon180);
        setLink('icon', icon192, '192x192');
        setLink('icon', icon512, '512x512');
        const manifest = {
          name: 'Movo — Your money. Your moves.',
          short_name: 'Movo',
          start_url: location.href,
          scope: location.href,
          display: 'standalone',
          background_color: '#F4F5FA',
          theme_color: '#2E4FE0',
          icons: [
            { src: icon192, sizes: '192x192', type: 'image/png' },
            { src: icon512, sizes: '512x512', type: 'image/png' }
          ]
        };
        const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
        setLink('manifest', URL.createObjectURL(blob));
      } catch (e) { /* Add to Home Screen still works without the custom icon */ }
    })();
  </script>
  <style>
    :root {
      --bg: #F4F5FA;
      --surface: #FFFFFF;
      --surface-2: #FBFBFE;
      --surface-3: #EEF0F8;
      --text: #15151C;
      --text-dim: #54525F;
      --text-faint: #77768A;
      --accent: #2E4FE0;
      --accent-ink: #FFFFFF;
      --rule: #DEDFEC;
      --rule-soft: #ECEDF6;
      --green: #0E9F6E;
      --green-soft: rgba(14, 159, 110, 0.10);
      --amber: #B4650A;
      --amber-soft: rgba(180, 101, 10, 0.10);
      --red: #D6364F;
      --red-soft: rgba(214, 54, 79, 0.10);
      --loan-color: #6D4FD1;
      --shadow: 0 14px 30px -18px rgba(20, 24, 60, 0.20);
      --font-display: 'Newsreader', Georgia, 'Times New Roman', serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --radius: 14px;
      --radius-sm: 9px;
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #17171F;
        --surface: #1E1E27;
        --surface-2: #262631;
        --surface-3: #30303C;
        --text: #F4F4F8;
        --text-dim: #B2B1C0;
        --text-faint: #807F92;
        --accent: #5B7CFF;
        --accent-ink: #FFFFFF;
        --rule: #34343F;
        --rule-soft: #26262F;
        --green: #3EDDA0;
        --green-soft: rgba(62, 221, 160, 0.16);
        --amber: #FFBA4C;
        --amber-soft: rgba(255, 186, 76, 0.16);
        --red: #FF6E7E;
        --red-soft: rgba(255, 110, 126, 0.17);
        --loan-color: #A78BFF;
        --shadow: 0 16px 36px -16px rgba(4, 4, 10, 0.6);
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --bg: #17171F;
      --surface: #1E1E27;
      --surface-2: #262631;
      --surface-3: #30303C;
      --text: #F4F4F8;
      --text-dim: #B2B1C0;
      --text-faint: #807F92;
      --accent: #5B7CFF;
      --accent-ink: #FFFFFF;
      --rule: #34343F;
      --rule-soft: #26262F;
      --green: #3EDDA0;
      --green-soft: rgba(62, 221, 160, 0.16);
      --amber: #FFBA4C;
      --amber-soft: rgba(255, 186, 76, 0.16);
      --red: #FF6E7E;
      --red-soft: rgba(255, 110, 126, 0.17);
      --loan-color: #A78BFF;
      --shadow: 0 16px 36px -16px rgba(4, 4, 10, 0.6);
      color-scheme: dark;
    }

    :root[data-theme="light"] {
      --bg: #F4F5FA;
      --surface: #FFFFFF;
      --surface-2: #FBFBFE;
      --surface-3: #EEF0F8;
      --text: #15151C;
      --text-dim: #54525F;
      --text-faint: #77768A;
      --accent: #2E4FE0;
      --accent-ink: #FFFFFF;
      --rule: #DEDFEC;
      --rule-soft: #ECEDF6;
      --green: #0E9F6E;
      --green-soft: rgba(14, 159, 110, 0.10);
      --amber: #B4650A;
      --amber-soft: rgba(180, 101, 10, 0.10);
      --red: #D6364F;
      --red-soft: rgba(214, 54, 79, 0.10);
      --loan-color: #6D4FD1;
      --shadow: 0 14px 30px -18px rgba(20, 24, 60, 0.20);
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      transition: background .25s ease, color .25s ease;
    }

    #root {
      min-height: 100vh;
    }

    ::selection {
      background: var(--accent);
      color: var(--accent-ink);
    }

    a {
      color: inherit;
    }

    button {
      font-family: inherit;
    }

    input,
    select,
    textarea {
      font-family: inherit;
    }

    .num {
      font-variant-numeric: tabular-nums;
    }

    .serif {
      font-family: var(--font-display);
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--rule);
      border-radius: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    .app-shell {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 236px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--rule);
      padding: 22px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 6px 10px 22px 10px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .brand .mark {
      font-family: var(--font-sans);
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text);
    }

    .logo-pulse {
      animation: markPulse 2.2s ease-in-out infinite;
    }

    @keyframes markPulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.1);
      }
    }

    .brand .tag {
      font-size: 10.5px;
      color: var(--text-faint);
      letter-spacing: .02em;
    }

    .navitem {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 9px 11px;
      border-radius: 10px;
      cursor: pointer;
      color: var(--text-dim);
      font-size: 13.5px;
      font-weight: 500;
      border: 1px solid transparent;
      user-select: none;
    }

    .navitem svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }

    .navitem:hover {
      background: var(--surface-2);
      color: var(--text);
    }

    .navitem.active {
      background: var(--surface-3);
      color: var(--text);
      border-color: var(--rule);
    }

    .navsection {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text-faint);
      padding: 16px 11px 4px;
    }

    .sidebar-add {
      margin-top: auto;
      padding-top: 14px;
    }

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: calc(16px + env(safe-area-inset-top, 0px)) 26px 16px;
      border-bottom: 1px solid var(--rule);
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 20;
    }

    .content {
      padding: 26px 32px 100px;
      max-width: 1240px;
      width: 100%;
      margin: 0 auto;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      padding: 18px;
    }

    .card-tight {
      padding: 14px;
    }

    .h1 {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 600;
      margin: 0;
      line-height: 1.2;
    }

    .h2 {
      font-family: var(--font-display);
      font-size: 19px;
      font-weight: 600;
      margin: 0 0 2px;
    }

    .h3 {
      font-size: 12.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-faint);
      margin: 0;
    }

    .muted {
      color: var(--text-dim);
    }

    .faint {
      color: var(--text-faint);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid var(--rule);
      background: var(--surface-2);
      color: var(--text);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: normal;
      word-break: break-word;
      text-align: center;
      max-width: 100%;
      line-height: 1.3;
    }

    .btn:hover {
      background: var(--surface-3);
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }

    .btn-primary:hover {
      filter: brightness(1.06);
    }

    .btn-ghost {
      background: transparent;
      border-color: transparent;
    }

    .btn-ghost:hover {
      background: var(--surface-2);
    }

    .btn-sm {
      padding: 6px 11px;
      font-size: 12.5px;
      border-radius: 8px;
    }

    .btn-danger {
      color: var(--red);
    }

    .btn-block {
      width: 100%;
    }

    .row>.btn-block {
      flex: 1 1 0;
      width: auto;
      min-width: 0;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--rule);
      background: var(--surface-2);
      cursor: pointer;
      color: var(--text-dim);
    }

    .icon-btn:hover {
      color: var(--text);
      background: var(--surface-3);
    }

    .icon-btn svg {
      width: 16px;
      height: 16px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 600;
    }

    .pill-green {
      background: var(--green-soft);
      color: var(--green);
    }

    .pill-amber {
      background: var(--amber-soft);
      color: var(--amber);
    }

    .pill-red {
      background: var(--red-soft);
      color: var(--red);
    }

    .pill-muted {
      background: var(--surface-3);
      color: var(--text-dim);
    }

    .row {
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .between {
      justify-content: space-between;
      flex-wrap: wrap;
      row-gap: 10px;
    }

    .grid {
      display: grid;
      gap: 14px;
    }

    .grid-2 {
      grid-template-columns: 1fr 1fr;
    }

    .grid-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .grid-4 {
      grid-template-columns: repeat(4, 1fr);
    }

    @media (max-width:820px) {

      .grid-2,
      .grid-3,
      .grid-4 {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width:560px) {

      .grid-2,
      .grid-3,
      .grid-4 {
        grid-template-columns: 1fr;
      }
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 13px;
      min-width: 0;
    }

    .field label {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-dim);
    }

    input,
    select,
    textarea {
      font-size: 16px;
    }

    .field input,
    .field select,
    .field textarea {
      background: var(--surface-2);
      border: 1px solid var(--rule);
      border-radius: 9px;
      padding: 12px 13px;
      color: var(--text);
      font-size: 16px;
      outline: none;
      min-height: 46px;
      width: 100%;
      max-width: 100%;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--accent);
    }

    .field-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .field-row .field {
      flex: 1;
      min-width: 140px;
    }

    .hint {
      font-size: 11.5px;
      color: var(--text-faint);
    }

    .input-ui {
      background: var(--surface-2);
      border: 1px solid var(--rule);
      border-radius: 9px;
      padding: 11px 12px;
      color: var(--text);
      font-size: 15px;
      outline: none;
      min-height: 44px;
      width: 100%;
      max-width: 100%;
    }

    .input-ui:focus {
      border-color: var(--accent);
    }

    .bank-search-wrap {
      position: relative;
    }

    .bank-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 10px;
      max-height: 220px;
      overflow-y: auto;
      z-index: 50;
      box-shadow: var(--shadow);
    }

    .bank-option {
      padding: 11px 13px;
      font-size: 14.5px;
      cursor: pointer;
      border-bottom: 1px solid var(--rule-soft);
    }

    .bank-option:last-child {
      border-bottom: none;
    }

    .bank-option:hover,
    .bank-option.hl {
      background: var(--surface-2);
    }

    .type-toggle {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .type-toggle button {
      padding: 8px 13px;
      border-radius: 9px;
      border: 1px solid var(--rule);
      background: var(--surface-2);
      color: var(--text-dim);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .type-toggle button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }

    .list-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 4px;
      border-bottom: 1px solid var(--rule-soft);
    }

    .list-row:last-child {
      border-bottom: none;
    }

    .swatch {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 15px;
    }

    .bottomnav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      border-top: 1px solid var(--rule);
      display: none;
      justify-content: space-around;
      align-items: center;
      padding: 7px 4px calc(7px + env(safe-area-inset-bottom));
      z-index: 40;
    }

    .bottomnav .bn-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--text-faint);
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 8px;
      flex: 1;
    }

    .bottomnav .bn-item.active {
      color: var(--accent);
    }

    .bottomnav .bn-item svg {
      width: 19px;
      height: 19px;
    }

    .fab {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-ink);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      border: none;
      cursor: pointer;
      margin-top: -26px;
    }

    .fab svg {
      width: 22px;
      height: 22px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(6, 10, 12, 0.55);
      backdrop-filter: blur(2px);
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    @media (min-width:640px) {
      .modal-backdrop {
        align-items: center;
      }
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--rule);
      width: 100%;
      max-width: 480px;
      max-height: 88vh;
      overflow-y: auto;
      border-radius: 18px 18px 0 0;
      padding: 20px 20px 26px;
      box-shadow: var(--shadow);
    }

    @media (min-width:640px) {
      .modal {
        border-radius: 16px;
        max-height: 82vh;
      }
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .progress {
      height: 8px;
      border-radius: 5px;
      background: var(--surface-3);
      overflow: hidden;
    }

    .progress>div {
      height: 100%;
      border-radius: 5px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }

    th {
      text-align: left;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--text-faint);
      padding: 8px 10px;
      border-bottom: 1px solid var(--rule);
    }

    td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--rule-soft);
    }

    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 38px 18px;
      color: var(--text-dim);
      gap: 10px;
    }

    .empty svg {
      width: 34px;
      height: 34px;
      color: var(--text-faint);
    }

    .tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--rule);
      margin-bottom: 16px;
      overflow-x: auto;
    }

    .quick-actions {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding: 2px 2px 6px;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .quick-actions::-webkit-scrollbar {
      display: none;
    }

    .qa-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
      cursor: pointer;
      width: 62px;
    }

    .qa-circle {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;

    /* ============================= HELPERS ============================= */
    function uid(prefix) { return (prefix || 'id') + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); }
    function todayStr() { return new Date().toISOString().slice(0, 10); }
    function fmtINR(n, opts) {
      opts = opts || {};
      const v = Math.round((n || 0) * 100) / 100;
      const sign = v < 0 ? '-' : (opts.showPlus && v > 0 ? '+' : '');
      const abs = Math.abs(v);

    function fmtDate(d) {
      if (!d) return '';

    function fmtDateShort(d) {
      const dt = new Date(d + 'T00:00:00');

    function fmtFullDate(d) {
      const dt = d ? new Date(d) : new Date();

    }
    function fmtTime12(t) {
      if (!t) return '';
      const [h, m] = t.split(':').map(Number);
      const ampm = h >= 12 ? 'PM' : 'AM';
      const h12 = h % 12 === 0 ? 12 : h % 12;
      return h12 + ':' + String(m).padStart(2, '0') + ' ' + ampm;

    function initials(name) {
      if (!name || !name.trim()) return '•';
      const parts = name.trim().split(/\s+/);

      const last = parts.length > 1 ? parts[parts.length - 1][0] : '';
      return (first + last).toUpperCase();
    }
    function eventSpent(data, eventId) {

    function addDays(dateStr, n) {
      const dt = new Date(dateStr + 'T00:00:00');
      dt.setDate(dt.getDate() + n);
      return dt.toISOString().slice(0, 10);
    }
    function addMonths(dateStr, n) {
      const dt = new Date(dateStr + 'T00:00:00');
      dt.setMonth(dt.getMonth() + n);
      return dt.toISOString().slice(0, 10);
    }

    function sanitizeDecimal(v, allowNegative) {

      const firstDot = s.indexOf('.');
      if (firstDot !== -1) s = s.slice(0, firstDot + 1) + s.slice(firstDot + 1).replace(/\./g, '');
      return (neg ? '-' : '') + s;
    }
    function calcEMI(principal, annualRate, months) {
      if (!principal || !months) return 0;
      const r = (annualRate || 0) / 12 / 100;
      if (r === 0) return principal / months;
      const emi = principal * r * Math.pow(1 + r, months) / (Math.pow(1 + r, months) - 1);
      return emi;
    }

    function emptyState() {

    /* ============================= CALC ENGINE ============================= */
    function accountEffect(t, accountId) {
      // returns signed amount effect of transaction t on given accountId
      let e = 0;
      if (t.type === 'income' && t.accountId === accountId) e += t.amount;
      else if (t.type === 'expense' && t.accountId === accountId) e -= t.amount;
      else if (t.type === 'transfer') {
        if (t.accountId === accountId) e -= t.amount;
        if (t.toAccountId === accountId) e += t.amount;
      }
      else if (t.type === 'investment' && t.accountId === accountId) e -= t.amount;
      else if (t.type === 'loan_payment' && t.accountId === accountId) e -= t.amount;
      else if (t.type === 'loan_received' && t.accountId === accountId) e += t.amount;
      return e;
    }
    function accountBalanceAt(account, transactions, asOfDate) {
      let bal = account.openingBalance || 0;
      for (const t of transactions) {
        if (asOfDate && t.date > asOfDate) continue;
        bal += accountEffect(t, account.id);
      }
      return bal;
    }
    function allAccountBalances(data, asOfDate) {
      const map = {};
      for (const a of data.accounts) map[a.id] = accountBalanceAt(a, data.transactions, asOfDate);
      return map;
    }
    function spendableTotal(data, asOfDate) {
      const map = allAccountBalances(data, asOfDate);
      let sum = 0;
      for (const a of data.accounts) {
        if (a.type === 'credit_card') continue;
        sum += map[a.id] || 0;
      }
      return sum;
    }
    function loanRemainingAt(loan, transactions, asOfDate) {
      if (asOfDate && loan.startDate > asOfDate) return 0;
      let paid = 0;
      for (const t of transactions) {
        if (t.type === 'loan_payment' && t.loanId === loan.id) {
          if (!asOfDate || t.date <= asOfDate) paid += t.amount;
        }
      }
      return Math.max(0, (loan.originalAmount || 0) - paid);
    }
    function investmentValueAt(inv, transactions, asOfDate) {
      let val = 0;
      let hasTx = false;
      for (const t of transactions) {
        if (t.type === 'investment' && t.investmentId === inv.id) {
          hasTx = true;
          if (!asOfDate || t.date <= asOfDate) val += t.amount;
        }
      }
      if (!hasTx) {
        if (!asOfDate || (inv.startDate && inv.startDate <= asOfDate)) return inv.principal || 0;
        return 0;
      }
      return val;
    }
    function netWorthAt(data, asOfDate) {
      const accBal = allAccountBalances(data, asOfDate);
      let assets = 0;
      for (const a of data.accounts) { if (a.type !== 'credit_card') assets += accBal[a.id] || 0; }
      let liabilities = 0;
      for (const a of data.accounts) { if (a.type === 'credit_card') { const b = accBal[a.id] || 0; if (b < 0) liabilities += -b; } }
      let investAssets = 0;
      for (const inv of data.investments) investAssets += investmentValueAt(inv, data.transactions, asOfDate);
      let loanLiab = 0;
      for (const l of data.loans) loanLiab += loanRemainingAt(l, data.transactions, asOfDate);
      return { netWorth: assets + investAssets - liabilities - loanLiab, assets, investAssets, liabilities, loanLiab };
    }
    function nextLoanDueDates(loan, count, fromDate) {
      // returns array of {date, amount} for upcoming EMI installments not yet paid, based on paidEmis count
      const out = [];
      const remainingEmis = Math.max(0, (loan.totalEmis || 0) - (loan.paidEmis || 0));
      if (remainingEmis <= 0) return out;
      let base = loan.startDate || fromDate;
      for (let i = 0; i < remainingEmis && out.length < count; i++) {
        const dueDate = addMonths(base, (loan.paidEmis || 0) + i + 1);
        out.push({ date: dueDate, amount: loan.emi || 0 });
      }
      return out;
    }
    function billOccurrences(bill, horizonEnd, fromDate) {
      const out = [];
      let d = bill.dueDate;
      if (!d) return out;
      if (bill.frequency === 'once') {
        if (d >= fromDate && d <= horizonEnd && !bill.paid) out.push({ date: d, amount: bill.amount });
        return out;
      }
      // roll forward to first occurrence >= fromDate
      let guard = 0;
      while (d < fromDate && guard < 600) {
        if (bill.frequency === 'monthly') d = addMonths(d, 1);
        else if (bill.frequency === 'weekly') d = addDays(d, 7);
        else if (bill.frequency === 'yearly') d = addMonths(d, 12);
        else break;
        guard++;
      }
      guard = 0;
      while (d <= horizonEnd && guard < 60) {
        out.push({ date: d, amount: bill.amount });
        if (bill.frequency === 'monthly') d = addMonths(d, 1);
        else if (bill.frequency === 'weekly') d = addDays(d, 7);
        else if (bill.frequency === 'yearly') d = addMonths(d, 12);
        else break;
        guard++;
      }
      return out;
    }
    function recurringOccurrences(rec, horizonEnd, fromDate) {
      const out = [];
      if (!rec.active) return out;
      let d = rec.nextDate || fromDate;
      let guard = 0;
      while (d < fromDate && guard < 600) {
        if (rec.frequency === 'monthly') d = addMonths(d, 1);
        else if (rec.frequency === 'weekly') d = addDays(d, 7);
        else if (rec.frequency === 'daily') d = addDays(d, 1);
        else if (rec.frequency === 'yearly') d = addMonths(d, 12);
        else break;
        guard++;
      }
      guard = 0;
      while (d <= horizonEnd && guard < 400) {
        out.push({ date: d, amount: rec.amount });
        if (rec.frequency === 'monthly') d = addMonths(d, 1);
        else if (rec.frequency === 'weekly') d = addDays(d, 7);
        else if (rec.frequency === 'daily') d = addDays(d, 1);
        else if (rec.frequency === 'yearly') d = addMonths(d, 12);
        else break;
        guard++;
      }
      return out;
    }
    function buildUpcomingEvents(data, horizonDays, fromDate) {
      fromDate = fromDate || todayStr();
      const horizonEnd = addDays(fromDate, horizonDays);
      const events = [];
      for (const b of data.bills) {
        for (const occ of billOccurrences(b, horizonEnd, fromDate)) {
          events.push({ date: occ.date, label: b.name, amount: -Math.abs(occ.amount), source: 'Bill', kind: 'bill', refId: b.id });
        }
      }
      for (const r of data.recurring) {
        for (const occ of recurringOccurrences(r, horizonEnd, fromDate)) {
          const sign = r.type === 'income' ? 1 : -1;
          events.push({ date: occ.date, label: r.label, amount: sign * Math.abs(occ.amount), source: r.type === 'income' ? 'Recurring income' : (r.type === 'investment' ? 'Recurring investment' : 'Recurring expense'), kind: 'recurring', refId: r.id });
        }
      }
      for (const l of data.loans) {
        for (const occ of nextLoanDueDates(l, 24, fromDate)) {
          if (occ.date >= fromDate && occ.date <= horizonEnd) {
            events.push({ date: occ.date, label: l.name + ' EMI', amount: -Math.abs(occ.amount), source: 'Loan EMI', kind: 'loan', refId: l.id });
          }
        }
      }
      events.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
      return events;
    }
    function nextIncomeDate(data, fromDate) {
      fromDate = fromDate || todayStr();
      const events = buildUpcomingEvents(data, 60, fromDate).filter(e => e.amount > 0);
      return events.length ? events[0].date : addDays(fromDate, 30);
    }
    function safeToSpend(data, fromDate) {
      fromDate = fromDate || todayStr();
      const horizon = data.settings.safeHorizonMode === 'nextIncome' ? Math.max(1, daysBetween(fromDate, nextIncomeDate(data, fromDate))) : (data.settings.safeHorizon || 30);
      const available = spendableTotal(data, fromDate);
      const events = buildUpcomingEvents(data, horizon, fromDate);
      const committedItems = events.filter(e => e.amount < 0 && e.source !== 'Recurring investment');
      const committed = committedItems.reduce((s, e) => s + Math.abs(e.amount), 0);
      const plannedGoals = data.goals.filter(g => !g.completed).map(g => ({ label: 'Goal: ' + g.name, amount: g.monthlyContribution || 0 })).filter(x => x.amount > 0);
      const plannedRecurringInvest = events.filter(e => e.source === 'Recurring investment').map(e => ({ label: e.label, amount: Math.abs(e.amount) }));
      const plannedItems = [...plannedGoals, ...plannedRecurringInvest];
      const planned = plannedItems.reduce((s, x) => s + x.amount, 0);
      const value = available - committed - planned;
      return { value, available, committed, planned, committedItems, plannedItems, horizon };
    }
    function projectBalance(data, days, fromDate) {
      fromDate = fromDate || todayStr();
      let bal = spendableTotal(data, fromDate);
      const events = buildUpcomingEvents(data, days, fromDate);
      const points = [{ date: fromDate, balance: bal, label: 'Today', actual: true }];
      for (const e of events) {
        bal += e.amount;
        points.push({ date: e.date, balance: bal, label: e.label, amount: e.amount, source: e.source, actual: false });
      }
      return points;
    }
    function monthSpendByCategory(data, ym) {
      const map = {};
      for (const t of data.transactions) {
        if (t.type === 'expense' && monthKey(t.date) === ym) {
          map[t.category || 'Other'] = (map[t.category || 'Other'] || 0) + t.amount;
        }
      }
      return map;
    }
    function monthTotals(data, ym) {
      let income = 0, expense = 0, invest = 0;
      for (const t of data.transactions) {
        if (monthKey(t.date) !== ym) continue;
        if (t.type === 'income') income += t.amount;
        else if (t.type === 'expense') expense += t.amount;
        else if (t.type === 'investment') invest += t.amount;
      }
      return { income, expense, invest, savings: income - expense - invest, savingsRate: income > 0 ? ((income - expense - invest) / income * 100) : 0 };
    }
    function last6Months(fromDate) {
      fromDate = fromDate || todayStr();
      const out = [];
      for (let i = 5; i >= 0; i--) out.push(monthKey(addMonths(fromDate, -i)));
      return out;
    }

    /* ---- Money Streak: consecutive days with at least one logged transaction ---- */
    function computeStreak(data) {
      const days = new Set(data.transactions.map(t => t.date));
      if (days.size === 0) return 0;
      let streak = 0;
      let d = todayStr();
      if (!days.has(d)) d = addDays(d, -1); // don't break the streak just because today hasn't been logged yet
      while (days.has(d)) { streak++; d = addDays(d, -1); }
      return streak;
    }

    /* ---- Money Health Score: a single 0-100 score from four weighted factors ---- */
    function computeHealthScore(data) {
      const today = todayStr();
      const ym = monthKey(today);
      const totals = monthTotals(data, ym);
      const spendable = spendableTotal(data, today);

      // 1) Savings rate (30 pts) — 20%+ savings rate scores full marks
      const savingsRate = totals.income > 0 ? (totals.savings / totals.income) * 100 : 0;
      const savingsPts = Math.max(0, Math.min(30, (savingsRate / 20) * 30));

      // 2) Budget adherence (20 pts) — % of budgets currently within limit
      const spendByCat = monthSpendByCategory(data, ym);
      let budgetPts = 20;
      if (data.budgets.length > 0) {
        const within = data.budgets.filter(b => (spendByCat[b.category] || 0) <= b.amount).length;
        budgetPts = (within / data.budgets.length) * 20;
      }

      // 3) Emergency fund coverage (25 pts) — spendable balance vs avg monthly expense, target 3 months
      const last3 = [0, 1, 2].map(i => monthTotals(data, monthKey(addMonths(today, -i))).expense);
      const avgExpense = last3.reduce((s, x) => s + x, 0) / 3;
      const monthsCovered = avgExpense > 0 ? spendable / avgExpense : (spendable > 0 ? 3 : 0);
      const efPts = Math.max(0, Math.min(25, (monthsCovered / 3) * 25));

      // 4) Debt load (25 pts) — total monthly EMI vs monthly income, lower is better, target under 30%
      const totalEmi = data.loans.filter(l => l.paidEmis < l.totalEmis).reduce((s, l) => s + (l.emi || 0), 0);
      const incomeRef = totals.income > 0 ? totals.income : (data.recurring.filter(r => r.type === 'income').reduce((s, r) => s + r.amount, 0) || 1);
      const debtRatio = totalEmi / incomeRef;
      const debtPts = Math.max(0, Math.min(25, 25 - (debtRatio / 0.4) * 25));

      const score = Math.round(savingsPts + budgetPts + efPts + debtPts);
      let band, color;
      if (score >= 80) { band = 'Excellent'; color = 'var(--green)'; }
      else if (score >= 60) { band = 'Good'; color = 'var(--green)'; }
      else if (score >= 40) { band = 'Needs attention'; color = 'var(--amber)'; }
      else { band = 'At risk'; color = 'var(--red)'; }

      return {
        score, band, color,
        factors: [
          { label: 'Savings rate', points: Math.round(savingsPts), max: 30, detail: savingsRate.toFixed(0) + '% saved this month', tip: savingsRate < 20 ? 'Try to save at least 20% of what you earn each month.' : 'Great savings rate — keep it up.' },
          { label: 'Budget adherence', points: Math.round(budgetPts), max: 20, detail: data.budgets.length ? Math.round(budgetPts / 20 * 100) + '% of budgets on track' : 'No budgets set yet', tip: data.budgets.length === 0 ? 'Set a budget or two to keep spending in check.' : (budgetPts < 20 ? 'A few categories are over budget this month.' : 'All budgets are on track.') },
          { label: 'Emergency fund', points: Math.round(efPts), max: 25, detail: monthsCovered.toFixed(1) + ' months of expenses covered', tip: monthsCovered < 3 ? 'Aim for 3+ months of expenses in easily accessible savings.' : 'Solid emergency cushion.' },
          { label: 'Debt load', points: Math.round(debtPts), max: 25, detail: (debtRatio * 100).toFixed(0) + '% of income goes to EMIs', tip: debtRatio > 0.4 ? 'Your EMIs are taking up a large share of income — be cautious with new loans.' : 'Debt load looks manageable.' },
        ],
      };
    }

    /* ---- Lightweight SVG charts (no external chart lib; hand-rolled, theme-aware) ---- */
    function LineChart({ points, height, width, formatY, showZero }) {
      height = height || 180; width = width || 640;
      if (!points || points.length < 2) {
        return <div className="faint" style={{ fontSize: 13, padding: '30px 0', textAlign: 'center' }}>Not enough data yet to draw a chart.</div>;
      }
      const pad = { l: 8, r: 8, t: 16, b: 22 };
      const vals = points.map(p => p.y);
      let min = Math.min(...vals, showZero ? 0 : Infinity);
      let max = Math.max(...vals, showZero ? 0 : -Infinity);
      if (min === max) { min -= 1; max += 1; }
      const range = max - min;
      const innerW = width - pad.l - pad.r, innerH = height - pad.t - pad.b;
      const xForI = (i) => pad.l + (points.length === 1 ? 0 : (i / (points.length - 1)) * innerW);
      const yForV = (v) => pad.t + innerH - ((v - min) / range) * innerH;
      const path = points.map((p, i) => (i === 0 ? 'M' : 'L') + xForI(i).toFixed(1) + ',' + yForV(p.y).toFixed(1)).join(' ');
      const zeroY = yForV(0);
      const areaPath = path + ` L${xForI(points.length - 1).toFixed(1)},${(pad.t + innerH).toFixed(1)} L${xForI(0).toFixed(1)},${(pad.t + innerH).toFixed(1)} Z`;
      const todayIdx = points.findIndex(p => p.actual === false);
      return (
        <svg viewBox={`0 0 ${width} ${height}`} style={{ width: '100%', height: 'auto', display: 'block' }} preserveAspectRatio="none">
          <defs>
            <linearGradient id="lcFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="var(--accent)" stopOpacity="0.22" />
              <stop offset="100%" stopColor="var(--accent)" stopOpacity="0" />
            </linearGradient>
          </defs>
          {showZero && min < 0 && max > 0 && <line x1={pad.l} y1={zeroY} x2={width - pad.r} y2={zeroY} stroke="var(--rule)" strokeDasharray="3,3" />}
          <path d={areaPath} fill="url(#lcFill)" stroke="none" />
          <path d={path} fill="none" stroke="var(--accent)" strokeWidth="2.2" strokeLinejoin="round" strokeLinecap="round" />
          {points.map((p, i) => (
            <circle key={i} cx={xForI(i)} cy={yForV(p.y)} r={i === 0 || i === points.length - 1 ? 3.4 : 2.2}
              fill={p.actual === false && todayIdx === i ? 'var(--accent)' : 'var(--surface)'} stroke="var(--accent)" strokeWidth="1.6" />
          ))}
        </svg>
      );
    }
    function BarChart({ items, height, color, formatY }) {
      height = height || 180;
      const max = Math.max(1, ...items.map(i => i.value));
      return (
        <div style={{ display: 'flex', alignItems: 'flex-end', gap: 10, height, padding: '4px 2px' }}>
          {items.map((it, i) => (
            <div key={i} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'flex-end', height: '100%', gap: 6, minWidth: 0 }}>
              <div className="faint num" style={{ fontSize: 10.5 }}>{formatY ? formatY(it.value) : it.value}</div>

              <div className="faint" style={{ fontSize: 10.5, textAlign: 'center', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', width: '100%' }}>{it.label}</div>
            </div>

    function DonutChart({ segments, size, thickness, centerLabel, centerSub }) {
      size = size || 150; thickness = thickness || 18;
      const total = segments.reduce((s, x) => s + x.value, 0) || 1;
      const r = (size - thickness) / 2;
      const cx = size / 2, cy = size / 2;
      const circ = 2 * Math.PI * r;
      let offset = 0;
      return (
        <div style={{ position: 'relative', width: size, height: size, flexShrink: 0 }}>
          <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ transform: 'rotate(-90deg)' }}>
            <circle cx={cx} cy={cy} r={r} fill="none" stroke="var(--surface-3)" strokeWidth={thickness} />
            {segments.map((s, i) => {
              const frac = s.value / total;
              const dash = frac * circ;
              const el = <circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={s.color} strokeWidth={thickness}
                strokeDasharray={`${dash} ${circ - dash}`} strokeDashoffset={-offset} strokeLinecap="butt" />;
              offset += dash;
              return el;
            })}
          </svg>
          <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
            <div className="serif" style={{ fontWeight: 600, fontSize: size > 130 ? 18 : 14 }}>{centerLabel}</div>
            {centerSub && <div className="faint" style={{ fontSize: 10.5 }}>{centerSub}</div>}
          </div>
        </div>
      );
    }

      const [investmentId, setInvestmentId] = useState(editing ? editing.investmentId : (data.investments[0] && data.investments[0].id) || '');

        { id: 'investment', label: '📈 Invest' },

        const amt = parseFloat(amount);
        if (!amt || amt <= 0) { setError('Enter a valid amount greater than zero.'); return; }

        if (type === 'transfer' && accountId === toAccountId) { setError('Choose two different accounts for a transfer.'); return; }

        if (type === 'investment' && !investmentId) { setError('Choose an investment or FD.'); return; }

        if (type === 'transfer') { base.accountId = accountId; base.toAccountId = toAccountId; }

          {type === 'income' && (

            </Field>
          )}

          {(type === 'expense' || type === 'income' || type === 'transfer' || type === 'loan_payment' || type === 'investment') && (
            <Field label={type === 'transfer' ? 'From account' : type === 'income' ? 'Deposit into' : 'Account'}>
              <Select value={accountId} onChange={e => setAccountId(e.target.value)}>

          {type === 'transfer' && (

          {type === 'loan_payment' && (

          {type === 'investment' && (

          {type === 'expense' && (

    function resizeImageFile(file, maxSize, cb) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          if (w > h) { if (w > maxSize) { h = Math.round(h * maxSize / w); w = maxSize; } }
          else { if (h > maxSize) { w = Math.round(w * maxSize / h); h = maxSize; } }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          cb(canvas.toDataURL('image/jpeg', 0.85));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    /* ============================= WHAT-IF SIMULATOR ============================= */
    function scenarioToSynthetic(data, deltas) {
      const clone = JSON.parse(JSON.stringify(data));
      for (const d of deltas) {
        if (d.recurring) {
          clone.recurring.push({ id: 'sim_' + d.id, type: d.amount >= 0 ? 'income' : 'expense', label: d.label, amount: Math.abs(d.amount), frequency: 'monthly', nextDate: d.date || todayStr(), accountId: (clone.accounts[0] || {}).id, active: true });
        } else {
          clone.bills.push({ id: 'sim_' + d.id, name: d.label, amount: Math.abs(d.amount), dueDate: d.date || todayStr(), frequency: 'once', category: 'Other', paid: false, __simIncome: d.amount > 0 });
        }
        if (d.loanParams) {
          clone.loans.push({ id: 'sim_loan_' + d.id, name: d.label, lender: '', originalAmount: d.loanParams.principal, interestRate: d.loanParams.rate, startDate: d.date || todayStr(), totalEmis: d.loanParams.months, paidEmis: 0, emi: d.loanParams.emi });
        }
      }
      return clone;
    }
    function scenarioMetrics(data, deltas, today) {
      const synth = scenarioToSynthetic(data, deltas);
      const sts = safeToSpend(synth, today);
      const nw = netWorthAt(synth, today);
      const proj = projectBalance(synth, 90, today);
      const monthlyCommitDelta = deltas.filter(d => d.recurring).reduce((s, d) => s + d.amount, 0);
      return { sts: sts.value, netWorth: nw.netWorth, balance90: proj[proj.length - 1].balance, monthlyCommitDelta };
    }
    function WhatIfPage({ data, applyScenario, toast, saveScenario, deleteScenario }) {
      const [mode, setMode] = useState('quick');
      const [deltas, setDeltas] = useState([]);
      const [scenarioName, setScenarioName] = useState('My scenario');
      const [compareIds, setCompareIds] = useState([]);
      const today = todayStr();

      const baseline = useMemo(() => ({
        sts: safeToSpend(data, today), nw: netWorthAt(data, today), proj: projectBalance(data, 90, today),
      }), [data]);
      const synthetic = useMemo(() => scenarioToSynthetic(data, deltas), [data, deltas]);
      const withScenario = useMemo(() => ({
        sts: safeToSpend(synthetic, today), nw: netWorthAt(synthetic, today), proj: projectBalance(synthetic, 90, today),
      }), [synthetic]);

      function addDelta(d) { setDeltas(prev => [...prev, { id: uid('delta'), ...d }]); }
      function removeDelta(id) { setDeltas(prev => prev.filter(d => d.id !== id)); }
      function discard() { setDeltas([]); setScenarioName('My scenario'); }
      function apply() {
        if (deltas.length === 0) return;
        if (!confirm('Apply this scenario to your real plan? This will create actual transactions, bills or loans.')) return;
        applyScenario(deltas);
        setDeltas([]);
        toast('Scenario applied to your plan.');
      }
      function saveCurrent() {
        if (deltas.length === 0) return;
        saveScenario(scenarioName || 'Untitled scenario', deltas);
        toast('Scenario saved for comparison.');
      }
      function loadScenario(s) {
        setDeltas(s.deltas.map(d => ({ ...d, id: uid('delta') })));
        setScenarioName(s.name);
        setMode('quick');
      }

      const stsDiff = withScenario.sts.value - baseline.sts.value;
      const nwDiff = withScenario.nw.netWorth - baseline.nw.netWorth;

      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
          <div>
            <div className="h1">What If…?</div>
            <div className="faint" style={{ fontSize: 13 }}>Try a financial decision before you make it. Nothing here changes your real data until you apply it.</div>
          </div>

          <div className="tabs">
            <button className={mode === 'quick' ? 'active' : ''} onClick={() => setMode('quick')}>Quick simulators</button>
            <button className={mode === 'custom' ? 'active' : ''} onClick={() => setMode('custom')}>Custom scenario</button>
            <button className={mode === 'saved' ? 'active' : ''} onClick={() => setMode('saved')}>Saved scenarios{data.scenarios.length ? ' (' + data.scenarios.length + ')' : ''}</button>
          </div>

          {mode === 'saved' ? (
            <SavedScenariosPanel data={data} today={today} compareIds={compareIds} setCompareIds={setCompareIds}
              onLoad={loadScenario} onDelete={deleteScenario} />
          ) : (
            <>
              {mode === 'quick' ? <QuickSimulators data={data} onAdd={addDelta} /> : <CustomScenarioBuilder onAdd={addDelta} />}

              <div className="card">
                <div className="row between" style={{ marginBottom: 10, gap: 8 }}>
                  <input value={scenarioName} onChange={e => setScenarioName(e.target.value)} style={{ background: 'transparent', border: 'none', outline: 'none', color: 'var(--text)', fontFamily: 'var(--font-display)', fontSize: 19, fontWeight: 600, flex: 1, minWidth: 0 }} />
                  {deltas.length > 0 && <button className="btn btn-sm" onClick={saveCurrent}>Save</button>}
                </div>
                {deltas.length === 0 ? (
                  <div className="faint" style={{ fontSize: 13 }}>No changes added yet. Use a simulator above to build a scenario.</div>
                ) : deltas.map(d => (
                  <div className="scenario-line" key={d.id}>
                    <span style={{ fontSize: 13.5 }}>{d.label}{d.recurring ? ' (monthly)' : ''}</span>
                    <span className="row" style={{ gap: 10 }}>
                      <span className="num" style={{ fontWeight: 700, color: d.amount < 0 ? 'var(--red)' : 'var(--green)' }}>{d.amount < 0 ? '' : '+'}{fmtINR(d.amount)}</span>
                      <button className="icon-btn" style={{ width: 26, height: 26 }} onClick={() => removeDelta(d.id)}><Icon name="close" style={{ width: 12, height: 12 }} /></button>
                    </span>
                  </div>
                ))}
              </div>

              {deltas.length > 0 && (
                <>
                  <div className="grid grid-2">
                    <div className="card">
                      <div className="h3">Safe to spend</div>
                      <div className="row between" style={{ marginTop: 6 }}>
                        <span className="faint num">{fmtINR(baseline.sts.value)}</span>
                        <Icon name="chevronR" style={{ color: 'var(--text-faint)', width: 14, height: 14 }} />
                        <span className="num" style={{ fontWeight: 700, color: stsDiff >= 0 ? 'var(--green)' : 'var(--red)' }}>{fmtINR(withScenario.sts.value)}</span>
                      </div>
                      <div className="faint" style={{ fontSize: 11.5, marginTop: 4 }}>{stsDiff >= 0 ? '+' : ''}{fmtINR(stsDiff)} change</div>
                    </div>
                    <div className="card">
                      <div className="h3">Net worth</div>
                      <div className="row between" style={{ marginTop: 6 }}>
                        <span className="faint num">{fmtINR(baseline.nw.netWorth)}</span>
                        <Icon name="chevronR" style={{ color: 'var(--text-faint)', width: 14, height: 14 }} />
                        <span className="num" style={{ fontWeight: 700, color: nwDiff >= 0 ? 'var(--green)' : 'var(--red)' }}>{fmtINR(withScenario.nw.netWorth)}</span>
                      </div>
                      <div className="faint" style={{ fontSize: 11.5, marginTop: 4 }}>{nwDiff >= 0 ? '+' : ''}{fmtINR(nwDiff)} change</div>
                    </div>
                  </div>
                  <div className="card">
                    <div className="h2" style={{ marginBottom: 6 }}>90-day projected balance</div>
                    <div style={{ position: 'relative' }}>
                      <LineChart points={withScenario.proj.map(p => ({ y: p.balance }))} height={150} showZero />
                    </div>
                    <div className="faint" style={{ fontSize: 11.5 }}>Gold line includes this scenario's changes.</div>
                  </div>
                  <div className="row" style={{ gap: 10 }}>
                    <button className="btn btn-block" onClick={discard}>Discard scenario</button>
                    <button className="btn btn-primary btn-block" onClick={apply}>Apply to my plan</button>
                  </div>
                </>
              )}
            </>
          )}
        </div>
      );
    }

    function SavedScenariosPanel({ data, today, compareIds, setCompareIds, onLoad, onDelete }) {
      function toggleCompare(id) {
        setCompareIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : (prev.length >= 3 ? prev : [...prev, id]));
      }
      const compared = data.scenarios.filter(s => compareIds.includes(s.id));
      const baselineMetrics = useMemo(() => scenarioMetrics(data, [], today), [data]);
      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
          {data.scenarios.length === 0 ? (
            <div className="card"><EmptyState icon="whatif" title="No saved scenarios" body="Build a scenario with the Quick simulators or Custom builder, then hit Save to keep it here for comparison." /></div>
          ) : (
            <div className="card">
              <div className="h3" style={{ marginBottom: 8 }}>Select up to 3 to compare</div>
              {data.scenarios.map(s => (
                <div className="list-row" key={s.id}>
                  <label className="row" style={{ gap: 10, cursor: 'pointer', flex: 1 }}>
                    <input type="checkbox" checked={compareIds.includes(s.id)} onChange={() => toggleCompare(s.id)} />
                    <div>
                      <div style={{ fontWeight: 600, fontSize: 14 }}>{s.name}</div>
                      <div className="faint" style={{ fontSize: 12 }}>{s.deltas.length} change{s.deltas.length === 1 ? '' : 's'}</div>
                    </div>
                  </label>
                  <button className="btn btn-sm" onClick={() => onLoad(s)}>Load</button>
                  <button className="icon-btn" style={{ width: 30, height: 30 }} onClick={() => { if (confirm('Delete saved scenario "' + s.name + '"?')) onDelete(s.id); }}><Icon name="trash" style={{ width: 14, height: 14 }} /></button>
                </div>
              ))}
            </div>
          )}
          {compared.length > 0 && (
            <div className="card" style={{ overflowX: 'auto' }}>
              <div className="h2" style={{ marginBottom: 10 }}>Comparison</div>
              <table>
                <thead>
                  <tr><th>Metric</th><th>Current plan</th>{compared.map(s => <th key={s.id}>{s.name}</th>)}</tr>
                </thead>
                <tbody>
                  <tr><td>Safe to spend</td><td className="num">{fmtINR(baselineMetrics.sts)}</td>{compared.map(s => { const m = scenarioMetrics(data, s.deltas, today); return <td key={s.id} className="num" style={{ color: m.sts >= baselineMetrics.sts ? 'var(--green)' : 'var(--red)' }}>{fmtINR(m.sts)}</td>; })}</tr>
                  <tr><td>90-day balance</td><td className="num">{fmtINR(baselineMetrics.balance90)}</td>{compared.map(s => { const m = scenarioMetrics(data, s.deltas, today); return <td key={s.id} className="num" style={{ color: m.balance90 >= baselineMetrics.balance90 ? 'var(--green)' : 'var(--red)' }}>{fmtINR(m.balance90)}</td>; })}</tr>
                  <tr><td>Net worth</td><td className="num">{fmtINR(baselineMetrics.netWorth)}</td>{compared.map(s => { const m = scenarioMetrics(data, s.deltas, today); return <td key={s.id} className="num" style={{ color: m.netWorth >= baselineMetrics.netWorth ? 'var(--green)' : 'var(--red)' }}>{fmtINR(m.netWorth)}</td>; })}</tr>
                  <tr><td>Monthly commitment change</td><td className="num">₹0</td>{compared.map(s => { const m = scenarioMetrics(data, s.deltas, today); return <td key={s.id} className="num" style={{ color: m.monthlyCommitDelta <= 0 ? 'var(--green)' : 'var(--red)' }}>{m.monthlyCommitDelta >= 0 ? '+' : ''}{fmtINR(m.monthlyCommitDelta)}</td>; })}</tr>
                </tbody>
              </table>
              <div className="faint" style={{ fontSize: 11.5, marginTop: 10 }}>Shown side-by-side so you can decide — Movo doesn't pick a "best" option for you.</div>
            </div>
          )}
        </div>
      );
    }

    function QuickSimulators({ data, onAdd }) {
      const [tab, setTab] = useState('buy');
      return (
        <div className="card">
          <div className="type-toggle">
            {[{ id: 'buy', label: 'Buy something' }, { id: 'loan', label: 'Take a loan' }, { id: 'sip', label: 'Increase SIP' }, { id: 'salary', label: 'Salary change' }, { id: 'save', label: 'Save more' }].map(t => (
              <button key={t.id} className={tab === t.id ? 'active' : ''} onClick={() => setTab(t.id)}>{t.label}</button>
            ))}
          </div>
          {tab === 'buy' && <BuySimulator onAdd={onAdd} data={data} />}
          {tab === 'loan' && <LoanSimulator onAdd={onAdd} data={data} />}
          {tab === 'sip' && <SipSimulator onAdd={onAdd} />}
          {tab === 'salary' && <SalarySimulator onAdd={onAdd} />}
          {tab === 'save' && <SaveMoreSimulator onAdd={onAdd} />}
        </div>
      );
    }
    function BuySimulator({ onAdd, data }) {
      const [what, setWhat] = useState('Phone');
      const [amount, setAmount] = useState('');
      const [date, setDate] = useState(todayStr());
      const sts = safeToSpend(data, todayStr());
      const amt = parseFloat(amount) || 0;
      return (
        <div>
          <div className="field-row">
            <Field label="What are you buying?"><input value={what} onChange={e => setWhat(e.target.value)} /></Field>
            <Field label="Amount (₹)"><input inputMode="decimal" value={amount} onChange={e => setAmount(sanitizeDecimal(e.target.value))} /></Field>
          </div>
          <Field label="Purchase date"><input type="date" value={date} onChange={e => setDate(e.target.value)} /></Field>
          {amt > 0 && (
            <div className="hint" style={{ marginBottom: 10 }}>
              Current safe-to-spend is {fmtINR(sts.value)}. After this purchase it would be about <b style={{ color: sts.value - amt >= 0 ? 'var(--green)' : 'var(--red)' }}>{fmtINR(sts.value - amt)}</b>.
            </div>
          )}
          <button className="btn btn-primary" disabled={!amt} onClick={() => onAdd({ label: 'Buy ' + what, amount: -amt, date, recurring: false })}>Add to scenario</button>
        </div>
      );

    function LoanSimulator({ onAdd }) {
      const [amount, setAmount] = useState('300000');
      const [rate, setRate] = useState('10');

        <div>
          <div className="field-row">

            <Field label="Interest (% p.a.)"><input inputMode="decimal" value={rate} onChange={e => setRate(sanitizeDecimal(e.target.value))} /></Field>
          </div>
          <Field label="Duration (months)"><input inputMode="numeric" value={months} onChange={e => setMonths(e.target.value)} /></Field>
          <div className="hint" style={{ marginBottom: 10 }}>Estimated EMI: <b>{fmtINR(emi)}</b> / month</div>
          <button className="btn btn-primary" onClick={() => onAdd({ label: 'New loan EMI', amount: -emi, date: todayStr(), recurring: true, loanParams: { principal: parseFloat(amount) || 0, rate: parseFloat(rate) || 0, months: parseInt(months) || 1, emi } })}>Add to scenario</button>

    function SalarySimulator({ onAdd }) {

        </div>

    function SaveMoreSimulator({ onAdd }) {

        <div>
          <Field label="Save extra per month (₹)"><input inputMode="decimal" value={amount} onChange={e => setAmount(sanitizeDecimal(e.target.value))} /></Field>

        </div>

    function CustomScenarioBuilder({ onAdd }) {
      const [label, setLabel] = useState('');
      const [amount, setAmount] = useState('');
